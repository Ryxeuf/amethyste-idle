# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app_locales: ['fr', 'en']
    default_locale: 'fr'
    app.version: '0.6.0-alpha'
    app.max_players_per_user: 1
    # ONB-02 : l'adresse d'expedition des e-mails du jeu (decision 2026-08-02).
    app.mailer_from: 'no-reply@amethyste.best'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            Symfony\Contracts\Cache\CacheInterface: '@cache.app'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/GameEngine/World/StaticUtcDayCycleFactorProvider.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    
    App\Twig\VersionExtension:
        arguments:
            $appEnv: '%kernel.environment%'
            $staticVersion: '%app.version%'
            $projectDir: '%kernel.project_dir%'

    App\GameEngine\Fight\CombatLogArchiver:
        arguments:
            $archiveDir: '%kernel.project_dir%/var/log/fights'

    App\GameEngine\Zone\ZoneDefinitionLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # RET-01 : pool declaratif des defis hebdomadaires. Ajouter un defi, c'est
    # ajouter une entree dans le YAML — pas une classe.
    App\GameEngine\Guild\WeeklyChallengeTemplateLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # FOY-01 : seuils de rang, decroissance, table de depot et seed du monde.
    # « Rien en dur » (PLAN_SETTLEMENTS) : recalibrer un foyer ne doit jamais
    # demander de toucher une classe.
    # RET-02 : pool declaratif des commissions hebdomadaires personnelles.
    App\GameEngine\Retention\WeeklyCommissionTemplateLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # RET-04 : paliers d'assiduite. Une table declarative, parce que le
    # chiffrage d'une recompense de presence se retend en observant le serveur.
    App\GameEngine\Retention\WeeklyAttendanceDefinitionLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\GameEngine\Settlement\SettlementDefinitionLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # FOY-15 : marees consequence. Seuils **et** composition des quatre beats
    # sont de la donnee — ajouter une maree declenchee, c'est ajouter un bloc.
    App\GameEngine\Season\ConsequenceTideDefinitionLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ECO-21 : le perimetre de la purete. Etroit et **declare** — la ligne du
    # cristal seule porte une bande, et cette decision se prend dans un fichier
    # de configuration, pas dans un nom de slug bien choisi.
    App\GameEngine\Economy\PurityDefinitionLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ZON-36 : l'affinite elementaire des ressources (loi 10). Le fichier porte
    # la **regle** — la ligne de recolte, corrigee par la signature de la zone
    # source — et non cinquante valeurs ecrites a la main.
    App\GameEngine\Economy\ResourceAffinityDefinitionLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # DOM-04 : les branches terminales de chaque arbre d'artisanat. Ajouter un
    # metier, c'est ajouter un bloc — jamais toucher une classe.
    App\GameEngine\Crafting\CraftBranchCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ARC-14a : les fourches des arbres de combat, la meme regle que ci-dessus.
    #
    # **Il n'etait pas cable, et personne ne s'en apercevait** : le seul
    # consommateur livre (`CombatBranchManager`) n'est instancie qu'a la main
    # dans son test, si bien que le conteneur n'a jamais eu a resoudre son
    # `$projectDir` — un service prive qu'on n'utilise pas est retire a la
    # compilation, et son cablage manquant avec lui. ARC-17c est le premier a
    # en avoir besoin au runtime.
    App\GameEngine\Progression\CombatBranchCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # FAC-01 : l'axe doctrinal — paires de tension, decote, patronage. Ajouter
    # une faction, c'est ajouter une ligne dans `config/game/factions.yaml`.
    App\GameEngine\Reputation\FactionTensionCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # FAC-02 : le routage geste -> faction et le plafond journalier des gestes.
    # Meme fichier, meme doctrine : ajouter un geste, c'est ajouter une ligne.
    App\GameEngine\Reputation\GestureReputationCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # FAC-03 : ce qu'etre Hostile coute, maison par maison. Le vocabulaire des
    # types est ferme — aucune consequence ne sait bloquer la boucle cœur.
    App\GameEngine\Reputation\HostileConsequenceCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # FAC-05 : le pool des contrats d'approvisionnement de la Fonderie.
    App\GameEngine\Reputation\FoundryContractCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # FAC-06 : le systeme propre des Ruelles — approche, receleur, rumeurs.
    App\GameEngine\Reputation\ShadowsMarketCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ONB-09 : ce que le catalogue dit de chaque arbre — deux phrases, et pas
    # une de plus. Le fichier n'a aucun champ pour les nœuds ni les valeurs :
    # une donnee qui n'existe pas ne fuit pas.
    App\GameEngine\Progression\DomainCatalogDescriptions:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ONB-20b : l'echelle de port des armes. Une famille enseignee par un seul
    # arbre imposerait son element par la bande — le loader la refuse.
    App\GameEngine\Progression\EquipmentPortCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ARC-03 : le vocabulaire ferme des leviers, et le convertisseur unique.
    # Les taux de change et les plafonds vivent en donnees parce que le canon
    # previent qu'aucun de ses nombres n'est definitif (GAME_ARCHETYPES § 0.2) —
    # le simulateur d'ARC-17 les rejouera.
    App\GameEngine\Progression\CombatLeverDefinitionLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # DOM-04 : le seul respec payant du jeu (GAME_DOMAINS § 6). Ce qu'on paie
    # n'est pas d'avoir change d'avis sur un bonus, c'est d'avoir change
    # d'identite — le respec de points ordinaire reste doux.
    App\GameEngine\Crafting\CraftSpecializationService:
        arguments:
            $respecCost: 2500

    # FOY-17 : denominateur du dimensionnement du monde (BALANCE § 22.5).
    # Un « joueur regulier » depense ~60 % de sa regeneration quotidienne, soit
    # ~150 points/jour et ~4 200 sur une maree de 28 jours. Ces deux nombres
    # sont a retendre en observant le serveur, jamais a coder en dur.
    App\GameEngine\World\WorldLoadService:
        arguments:
            $regularPlayerDailyEnergy: 150
            $tideDays: 28

    # FOY-17b : le facteur de monde `W`, par paliers discrets (BALANCE § 22.4).
    # Ancrage : `W = 1` a ~50 joueurs effectifs, la cible de calibrage (§ 22.3).
    # Jamais en continu — un reglage qui glisse en permanence rend impossible a
    # constituer le savoir du prospecteur, qu'on a precisement rendu monnayable.
    App\GameEngine\World\WorldScaleService:
        arguments:
            $bands:
                - { population: 0, scale: 0.5 }
                - { population: 15, scale: 0.75 }
                - { population: 35, scale: 1 }
                - { population: 80, scale: 1.5 }
                - { population: 160, scale: 2 }
                - { population: 320, scale: 3 }
            # Plancher : un serveur qui demarre a cinq joueurs ne doit pas se
            # refermer sur eux.
            $floor: 0.5
            # Marees completes a mesurer avant qu'une contraction soit permise.
            $graceTides: 1
            $tideDays: 28

    # ONB-03 : le limiteur de connexion, cable a la main.
    # `login_throttling: { max_attempts: N }` derive la borne par IP de la borne
    # par identifiant (N x 5) : impossible de regler l'une sans l'autre. On
    # fournit donc les deux limiteurs explicitement.
    app.login_rate_limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            - '@limiter.login_global'
            - '@limiter.login_local'
            - '%kernel.secret%'

    # WIK-02 — le wiki joueur lit `docs/wiki/`, versionne avec le code.
    App\GameEngine\Wiki\WikiLibrary:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ZON-41 — l'import verifie qu'un bandeau declare existe sur le disque, et
    # le signale sans casser. La racine publique est injectee plutot que
    # devinee : un service qui deduit son propre chemin se trompe le jour ou on
    # le lance depuis un autre repertoire.
    App\GameEngine\Zone\ZoneImporter:
        arguments:
            $publicDir: '%kernel.project_dir%/public'

    App\EventListener\LocaleListener:
        arguments:
            $defaultLocale: '%default_locale%'
        tags:
            - { name: kernel.event_subscriber }

    App\GameEngine\Guild\InfluenceAntiExploit:
        arguments:
            $dailyCapPerPlayerPerRegion: 500
            $diminishingKillThreshold: 10
            $diminishingWindowMinutes: 10
            $diminishingReturnsFactor: 0.1
            $lowLevelGapThreshold: 10
            $lowLevelDivisor: 5
            $xpPerLevel: 100
            $minActiveMembers: 3
            $activeMemberDays: 7

    # ECO-16 : seuils anti-abus de l'hotel des ventes, exposes ici pour se
    # calibrer sans toucher au code. Un plafond a 0 desactive la regle.
    App\GameEngine\Auction\AuctionAntiExploit:
        arguments:
            $pairTransactionCap: 10
            $pairWindowHours: 24
            # ECO-09 : plafond du canal des commandes, plus bas car il produit
            # du stuff lie, indetectable une fois livre.
            $craftOrderPairCap: 5

    App\Service\Monitoring\HealthChecker:
        arguments:
            $mercureUrl: '%env(MERCURE_URL)%'

    App\Service\Monitoring\MetricsCollector:
        arguments:
            $cache: '@cache.app'

