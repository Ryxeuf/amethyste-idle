# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app_locales: ['fr', 'en']
    default_locale: 'fr'
    app.version: '0.6.0-alpha'
    app.max_players_per_user: 1

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            Symfony\Contracts\Cache\CacheInterface: '@cache.app'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/GameEngine/World/StaticUtcDayCycleFactorProvider.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    
    App\Twig\VersionExtension:
        arguments:
            $appEnv: '%kernel.environment%'
            $staticVersion: '%app.version%'
            $projectDir: '%kernel.project_dir%'

    App\GameEngine\Fight\CombatLogArchiver:
        arguments:
            $archiveDir: '%kernel.project_dir%/var/log/fights'

    App\GameEngine\Zone\ZoneDefinitionLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # RET-01 : pool declaratif des defis hebdomadaires. Ajouter un defi, c'est
    # ajouter une entree dans le YAML — pas une classe.
    App\GameEngine\Guild\WeeklyChallengeTemplateLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\EventListener\LocaleListener:
        arguments:
            $defaultLocale: '%default_locale%'
        tags:
            - { name: kernel.event_subscriber }

    App\GameEngine\Guild\InfluenceAntiExploit:
        arguments:
            $dailyCapPerPlayerPerRegion: 500
            $diminishingKillThreshold: 10
            $diminishingWindowMinutes: 10
            $diminishingReturnsFactor: 0.1
            $lowLevelGapThreshold: 10
            $lowLevelDivisor: 5
            $xpPerLevel: 100
            $minActiveMembers: 3
            $activeMemberDays: 7

    # ECO-16 : seuils anti-abus de l'hotel des ventes, exposes ici pour se
    # calibrer sans toucher au code. Un plafond a 0 desactive la regle.
    App\GameEngine\Auction\AuctionAntiExploit:
        arguments:
            $pairTransactionCap: 10
            $pairWindowHours: 24
            # ECO-09 : plafond du canal des commandes, plus bas car il produit
            # du stuff lie, indetectable une fois livre.
            $craftOrderPairCap: 5

    App\Service\Monitoring\HealthChecker:
        arguments:
            $mercureUrl: '%env(MERCURE_URL)%'

    App\Service\Monitoring\MetricsCollector:
        arguments:
            $cache: '@cache.app'

