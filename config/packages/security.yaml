security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    
    # Configuration de l'héritage des rôles
    role_hierarchy:
        ROLE_STAFF:         ROLE_USER
        ROLE_GAME_DESIGNER: ROLE_STAFF
        ROLE_WORLD_BUILDER: ROLE_STAFF
        ROLE_MODERATOR:     ROLE_STAFF
        ROLE_ADMIN:         [ROLE_GAME_DESIGNER, ROLE_WORLD_BUILDER, ROLE_MODERATOR]
        ROLE_SUPER_ADMIN:   [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
        ROLE_PLAYER:        ROLE_USER
    
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            # ONB-03 : `User::isBanned` etait ecrit par l'administration et lu
            # nulle part. Le controle d'utilisateur ferme le login ; le
            # `BannedUserSubscriber` ferme les sessions deja ouvertes.
            user_checker: App\Security\UserChecker
            # ONB-03 : 5 essais / 15 min par identifiant, 30 / 15 min par IP.
            # Les deux limiteurs sont declares dans `rate_limiter.yaml` — les
            # valeurs par defaut de Symfony lient la borne par IP a celle par
            # identifiant, ce qui interdit de regler l'une sans l'autre.
            login_throttling:
                limiter: app.login_rate_limiter
            # API v1 : Bearer JWT pour les clients natifs (mobile/Steam),
            # en complement de la session cookie du client web.
            access_token:
                token_handler: App\Security\Api\ApiAccessTokenHandler
            logout:
                path: app_logout
                # where to redirect after logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                # ONB-03 : 30 jours. Une semaine redemandait le mot de passe a
                # chaque joueur qui saute un week-end — soit exactement ceux que
                # la retention cherche a faire revenir.
                lifetime: 2592000 # 30 days in seconds
                path: /

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            #
            # Voir l'ecran d'un joueur tel qu'il le voit — le seul moyen fiable
            # de diagnostiquer un blocage sans lui demander des captures. Garde
            # par ROLE_ALLOWED_TO_SWITCH, que seul ROLE_SUPER_ADMIN porte : un
            # moderateur sanctionne, il ne se met pas dans la peau des gens.
            # `?_switch_user=_exit` rend la main.
            switch_user: { role: ROLE_ALLOWED_TO_SWITCH }

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/v1/ping$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_USER }
        - { path: ^/game, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_STAFF }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon 