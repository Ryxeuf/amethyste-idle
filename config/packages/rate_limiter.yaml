framework:
    rate_limiter:
        # Account creation: 5 accounts / hour / IP (ONB-01).
        # Le multicomptage se combat par la porte de verification (ONB-04),
        # pas ici : ce limiteur ne vise que la creation en rafale.
        registration:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'
            lock_factory: null

        # Login throttling (ONB-03), cable par `security.login_rate_limiter`.
        # Deux bornes distinctes : l'identifiant vise et l'adresse qui essaie.
        # 5 essais par compte arretent la devinette d'un mot de passe ; 30 par
        # adresse arretent le bourrage d'identifiants sans punir un foyer ou un
        # cybercafe, ou plusieurs joueurs partagent une IP.
        login_local:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            lock_factory: null

        login_global:
            policy: 'sliding_window'
            limit: 30
            interval: '15 minutes'
            lock_factory: null

        # Mot de passe oublie (ONB-02), sur le modele du login : une borne par
        # adresse visee (on ne bombarde pas la boite d'un joueur), une par IP
        # (on ne sonde pas l'annuaire depuis une machine). Le refus est un 429
        # visible, jamais un faux succes.
        password_reset_local:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'
            lock_factory: null

        password_reset_global:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
            lock_factory: null

        # Renvoi du lien de verification (ONB-04) : chaque clic est un e-mail
        # sortant. Trois par heure et par compte — assez pour un dossier spam
        # recalcitrant, trop peu pour faire du guichet un canon a courrier.
        email_verification_resend:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'
            lock_factory: null

        # Combat actions: 5 req/s per player
        game_fight:
            policy: 'sliding_window'
            limit: 5
            interval: '1 second'
            lock_factory: null

        # Shop transactions: 3 req/s per player
        game_shop:
            policy: 'sliding_window'
            limit: 3
            interval: '1 second'
            lock_factory: null

        # Craft actions: 3 req/s per player
        game_craft:
            policy: 'sliding_window'
            limit: 3
            interval: '1 second'
            lock_factory: null
