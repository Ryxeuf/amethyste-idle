# =============================================================================
# L'axe doctrinal : les paires de tension et le patronage (FAC-01)
# =============================================================================
# GAME_WORLD § 6.4 a : « progresser chez l'un fait decroitre chez son opposé
# **au-delà du palier Ami** : Fonderie ↔ Cercle des Mages (Extraire /
# Preserver), Ordre des Chevaliers ↔ Confrerie des Ruelles (Ordre / Liberte).
# La Guilde des Marchands est **hors tension** — elle vend aux deux, c'est son
# identite. On peut etre bien vu de tous jusqu'a Ami ; au-dela, il faut
# choisir. »
#
# Ce que ce fichier change. Avant lui, les quatre factions montaient en
# parallele : un joueur assidu finissait Exalte partout, et l'appartenance ne
# disait plus rien de lui. La decote ne punit pas — elle demande de choisir.
#
# **Jamais de decroissance par inactivite** (principe du plan Retention). La
# reputation ne descend que par le **geste oppose** : l'absence ne coute rien.
# Aucun champ de ce fichier ne porte de duree, et c'est deliberé.
#
# Ajouter une faction, c'est ajouter une ligne ici. Rien en dur.
# =============================================================================

# --- Les paires de l'axe -----------------------------------------------------
# Une paire est symetrique : ce qui monte chez l'un retire chez l'autre, dans
# les deux sens. Une faction n'appartient **qu'a une seule paire** — deux
# oppositions rendraient l'axe illisible, et le loader le refuse.
#
# `fonderie` n'existe pas encore comme entite (elle arrive avec FAC-04). La
# paire est declaree quand meme : le jour ou la faction est semee, la tension
# est deja la, et personne n'a a se souvenir de revenir ici. Une paire dont un
# membre manque est **inerte**, pas invalide.
tension_pairs:
    -   left: 'fonderie'
        right: 'mages'
        axis: 'Extraire / Preserver'
    -   left: 'chevaliers'
        # Slug de code herite : la faction `ombres` porte depuis ZON-39 le
        # libelle canonique « Confrerie des Ruelles ». Renommer le slug
        # couterait une migration pour un mot ; le canon vit dans le libelle.
        right: 'ombres'
        axis: 'Ordre / Liberte'

# --- Hors tension ------------------------------------------------------------
# Se deduirait de l'absence dans les paires. On l'ecrit quand meme : une
# faction oubliee des paires et une faction volontairement neutre se lisent
# pareil dans le code, et pas du tout dans le jeu. Le loader refuse qu'une
# faction soit a la fois neutre et opposee.
neutral:
    - 'marchands'

# --- La decote ---------------------------------------------------------------
# `beyond_tier` : le palier a partir duquel la tension mord. En dessous, on
# peut etre bien vu de tout le monde — c'est ce qui permet de decouvrir les
# cinq maisons avant d'avoir a choisir.
#
# `percent` : la fraction du gain **au-dela du palier** retiree a l'opposé. A
# 50 %, deux gestes chez l'un valent un geste efface chez l'autre : on avance
# encore en aidant les deux, mais deux fois moins vite qu'en choisissant.
tension:
    beyond_tier: 'ami'
    percent: 50

    # Le plancher de la decote, en miroir du palier ou elle commence : on ne
    # peut pas renoncer a plus que ce qu'on aurait pu donner. Sans plancher, un
    # joueur d'un an serait Hostile a un point que rien ne pourrait rattraper.
    # La valeur n'est pas ecrite : elle est **derivee** de `beyond_tier`.
    floor_mirrors_beyond_tier: true

# --- Les gestes (FAC-02) -----------------------------------------------------
# GAME_WORLD § 6.4 b : « les quetes amorcent, les gestes font le regime de
# croisiere. » Une quete se fait une fois ; un geste se refait chaque jour, et
# c'est lui qui dit qui vous etes. Chaque route associe un geste du jeu a la
# faction qu'il nourrit — ajouter un geste, c'est ajouter une ligne ici.
#
# **Une route peut viser une faction pas encore semee** : `materia_melt` attend
# la Fonderie (FAC-04), `grey_market_sale` attend le marche gris des Ruelles
# (FAC-06). Le crochet est declare des maintenant et reste **inerte** — meme
# doctrine que les paires de tension, et pour la meme raison : personne ne se
# souvient de revenir cabler un crochet.
#
# `daily_cap` : le plafond de gain **par faction et par jour** sur les gestes
# (les quetes, elles, ne sont pas plafonnees — on ne refait pas une quete).
# Meme doctrine que le plafond journalier d'influence de guilde
# (`InfluenceAntiExploit`) : un geste repete nourrit, un geste ferme ne
# nourrit plus. A 200 points et 10-50 points le geste, le plafond laisse une
# vraie journee de jeu avant de fermer.
gestures:
    daily_cap: 200
    routes:
        # La vente conclue a l'hotel des ventes : le vendeur a mis quelque
        # chose sur le marche, et le marche l'a pris. C'est le geste marchand.
        auction_sale:
            faction: 'marchands'
            amount: 10
        # Abattre un mort-vivant : le geste de l'Ordre, qui veille sur ce que
        # le temps a laisse derriere lui. Le montant n'est pas ecrit — il suit
        # le palier du monstre, comme tout gain de kill.
        undead_kill:
            faction: 'chevaliers'
        # Crochet FAC-04 : fondre une materia nourrit la Fonderie. Inerte tant
        # que la faction n'est pas semee.
        materia_melt:
            faction: 'fonderie'
            amount: 15
        # Crochet FAC-04 : lire une materia nourrit le Cercle des Mages.
        materia_read:
            faction: 'mages'
            amount: 15
        # Crochet FAC-06 : une vente au receleur nourrit la Confrerie des
        # Ruelles. Inerte tant que le marche gris n'existe pas.
        grey_market_sale:
            faction: 'ombres'
            amount: 10

    # Les morts-vivants du bestiaire, par slug. Le bestiaire n'a pas de champ
    # « famille » (BES-01 a livre tier x rank, rien de plus) : la classification
    # vit ici, declarative, la ou elle sert. Le jour ou une famille de monstre
    # existera en donnee, cette liste se derivera au lieu de s'ecrire.
    undead_slugs:
        - 'zombie'
        - 'skeleton'
        - 'specter'
        - 'banshee'
        - 'ghost'
        - 'cursed_knight'
        - 'lesser_lich'
        - 'necromancer'
        - 'dune_wraith'
        - 'hoarfrost_shade'

# --- Hostile a consequences (FAC-03) -----------------------------------------
# GAME_WORLD § 6.4 d : etre Hostile (reputation negative) coute quelque chose
# aupres de chaque maison — mais **jamais la boucle cœur**. Deux bornes
# absolues, tenues par le vocabulaire ferme des types de consequence : aucun
# type ne peut bloquer l'energie, le voyage de base, le combat ou le plancher
# T1 — une consequence **surcharge ou refuse un privilege**, elle ne ferme
# jamais un droit.
#
# Les types actifs aujourd'hui : `shop_surcharge` (les Marchands font payer
# leur rancune au comptoir PNJ) et `bastion_travel_surcharge` (les fouilles de
# l'Ordre ralentissent l'entree dans les zones a foyer Bastion — un surcout de
# temps, jamais un refus). Les autres sont des **crochets declares en avance**,
# meme doctrine que les routes de geste : `altar_tax_ceiling` attend l'Autel
# d'eveil (REP), `poisoned_rumors` attend les rumeurs (FAC-06),
# `buyback_floor_closed` et `materia_reading_refused` attendent la Fonderie
# (FAC-04). Un crochet inerte n'est pas invalide.
hostile:
    consequences:
        marchands:
            -   type: 'shop_surcharge'
                percent: 10
        chevaliers:
            -   type: 'bastion_travel_surcharge'
                percent: 50
            -   type: 'altar_tax_ceiling'
        ombres:
            -   type: 'poisoned_rumors'
        fonderie:
            -   type: 'buyback_floor_closed'
        mages:
            -   type: 'materia_reading_refused'

# --- Le patronage ------------------------------------------------------------
# GAME_WORLD § 6.4 c : « les bonus de statistiques des paliers deviennent un
# patronage — on porte les couleurs d'une seule faction a la fois (changeable
# hors combat). Un palier de reputation ouvre des portes ; il n'empile jamais
# de la puissance. »
#
# `required_tier` reprend le palier de la tension, et ce n'est pas une
# coincidence : c'est au meme endroit qu'on cesse d'etre un visiteur.
patronage:
    required_tier: 'ami'
    # Le changement est libre — le renoncement se paie en reputation, pas en
    # gils. Le seul moment ou il est refuse est le combat : porter d'autres
    # couleurs entre deux tours changerait les statistiques en cours de geste.
    forbidden_in_combat: true
