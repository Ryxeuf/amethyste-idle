# =============================================================================
# Purete des ressources — perimetre (ECO-21)
# =============================================================================
# Decision D du socle de monde (docs/GAME_WORLD.md § 5.4) : toute amethyste ne se
# vaut pas. Emprunt a Star Wars Galaxies, corrige de son defaut — chez eux
# *toutes* les ressources avaient des statistiques, ce qui a transforme
# l'artisanat en tableur.
#
# Le perimetre est donc **etroit et explicite**, et il est declare ici plutot
# que devine dans le code : la ligne du cristal (amethyste, minerais, gemmes)
# porte une bande, tout le reste est fongible. Herbes, poissons, cuirs et bois
# n'en portent jamais — le plancher T1 (ECO-02) ne doit pas demander a un
# debutant de comparer des lots avant de forger sa premiere epee.
#
# Ajouter une matiere au perimetre est une decision de conception qui se prend
# ici, pas une consequence d'un nom de slug bien choisi.
# =============================================================================

scope:
    # Toute la ligne du cristal partage le prefixe `ore-` dans le monde livre :
    # `ore-copper` comme `ore-amethyst-crystal` ou `ore-ruby`. Le prefixe couvre
    # donc exactement les trois familles voulues — minerais, gemmes, amethyste —
    # et rien d'autre.
    slug_prefixes:
        - 'ore-'

    # Matieres qui portent le prefixe sans appartenir au perimetre. Vide
    # aujourd'hui ; l'entree existe pour que l'exception se declare au lieu de
    # se coder.
    excluded_slugs: []

    # Matieres hors prefixe a inclure malgre tout. Vide aujourd'hui : rien de la
    # ligne du cristal n'echappe au prefixe. Le jour ou une extension livrera
    # une gemme nommee autrement, elle s'inscrira ici.
    included_slugs: []

# =============================================================================
# Valeur marchande de la bande (MET-01)
# =============================================================================
# Le constat de GAME_TRADES § 3.2 : la bande avait une valeur d'usage
# (PurityChain la propage, CraftOrderManager l'exige) et aucune valeur
# d'echange. Un joueur qui investissait dans la qualite produisait moins
# d'objets pour le meme argent — la branche Preserver etait strictement
# dominee avant d'exister.
#
# L'echelle est super-lineaire volontairement : elle doit rendre le pur
# *interessant* et le parfait *deraisonnable a ignorer*. Le x9 n'est pas un
# chiffre de puissance — c'est la rarete de base (1 % des tirages) traduite
# en prix.
#
# Le multiplicateur s'applique au prix de reference de la matiere, partout ou
# un prix se calcule : rachat PNJ, prix de reference de l'hotel des ventes,
# estimation d'inventaire, valeur d'une commande de craft. Il se lit via
# `PurityPricer`, jamais en dur dans un appelant.
market:
    band_multipliers:
        trouble: 1
        clair: 1.8
        pur: 3.5
        parfait: 9

# =============================================================================
# Tirage de la bande a la recolte (ECO-22)
# =============================================================================
# D'ou vient la bande. C'est ici que le savoir du prospecteur prend une valeur
# marchande : deux joueurs qui recoltent le meme filon ne rapportent pas la meme
# chose, et celui qui sait ou et quand frapper rapporte mieux.
#
# Le tirage ne depend **jamais** de la chance seule. Trois facteurs le modulent,
# et chacun est une decision de jeu :
#   - la **vitalite** du filon — un filon ereinte ne rend plus que du trouble ;
#   - le **savoir** du recolteur — l'arbre de recolte deplace les poids vers le
#     haut, sans jamais garantir quoi que ce soit ;
#   - le **plafond** de vitalite, qui prime sur tout le reste.
#
# La Paleur (FOY-11) posera un second plafond, plus bas, quand elle existera.
draw:
    # Poids de base, avant modulation. Le parfait est rare **par construction** :
    # c'est ce qui rendra la materia rare sans table de drop (GAME_WORLD § 5.4).
    base_weights:
        trouble: 60
        clair: 30
        pur: 9
        parfait: 1

    # Plafond impose par la vitalite (stock / capacite). Lu de haut en bas : le
    # premier seuil atteint gagne. Un filon presse cesse de rendre du parfait
    # bien avant de cesser de rendre — c'est le signal que ZON-37 a rendu
    # lisible, et sans lui la couche de rarete resterait inerte.
    vitality_ceilings:
        - { at_least: 0.66, band: parfait }
        - { at_least: 0.33, band: pur }
        - { at_least: 0.10, band: clair }
        - { at_least: 0.0, band: trouble }

    # Le savoir du recolteur, lu sur le bonus de recolte que son arbre accorde.
    # Chaque point de bonus transfere ce nombre de points de poids du trouble
    # vers le clair, et du clair vers le pur — jamais directement vers le
    # parfait, qui ne s'achete pas a l'experience.
    skill_weight_per_point: 1
    skill_weight_cap: 25

# =============================================================================
# Signature d'amethyste par zone (ZON-32)
# =============================================================================
# « Une zone, une facon dont le temps s'est depose » (GAME_ZONES § 2, colonne
# « signature »). Les Mines rendent beaucoup et trouble ; la Crete peu et pur ;
# le Marais tire haut la nuit et bas le jour. Ces tendances etaient **ecrites
# dans un document et absentes du jeu** — deux zones se recoltaient a
# l'identique.
#
# **Une seule table declarative, aucune logique par zone.** Le signe se lit ici
# et nulle part ailleurs ; ajouter une zone, c'est ajouter une ligne.
#
# **Ce que le signe deplace : les poids, jamais le plafond.** « Trouble
# dominante » et « Pure frequente » decrivent une *distribution*, pas une borne.
# Un signe qui toucherait le plafond laisserait la Crete rendre du parfait sur
# un filon ereinte — et effacerait la vitalite (ZON-37), la Paleur (FOY-11) et
# l'Affleurement (RET-06) d'un seul geste.
#
# L'unite est celle de `skill_weight_per_point` : des points de poids transferes
# d'un cran a la fois, du trouble vers le clair et du clair vers le pur. Un signe
# **negatif** fait le chemin inverse. Jamais de raccourci vers le parfait : il ne
# s'achete ni a l'experience, ni a la geographie.
#
# **Ce qui n'est pas ici, et pourquoi.** La « quantite relative » de GAME_ZONES
# suppose un sous-produit d'amethyste a la recolte, qui n'existe pas encore : la
# declarer aujourd'hui serait un parametre que personne ne lit — exactement ce
# que le contrat du pilier territorial (FOY-16) interdit. L'**element** dominant
# appartient a ZON-36 pour la meme raison.
signatures:
    # Reference du monde : la Foret. Le depot sans a-coups donne une amethyste
    # sans surprise, et c'est contre elle que les autres zones se lisent.
    foret-des-murmures: { weight_shift: 0 }

    # La strate la plus jeune du monde : le temps y passe vite et leger. Le
    # debutant y apprend **qu'il existe** de l'amethyste, pas ou la chercher pure.
    vallons-d-aubepine: { weight_shift: -10 }

    # La plus grande quantite du monde — et la bande la plus basse. Trop de temps
    # tasse rend le geste illisible.
    mines-profondes: { weight_shift: -20 }

    # Erratique : le temps stagnant se depose mal, mais quand il prend, il prend
    # bien. Le Marais nocturne est le premier endroit ou un joueur d'Acte II voit
    # du **Pur** — et c'est l'information exclusive type du prospecteur.
    marais-brumeux: { weight_shift: -15, night_weight_shift: 30 }

    # Le pendant exact des Mines : peu, mais la plus haute moyenne du monde. Le
    # vent a emporte le meuble, ce qui reste est net.
    crete-de-ventombre: { weight_shift: 25 }

    # Le temps epuise n'a plus grand-chose a deposer — mais le biome Ambre
    # **conserve** : ce qui s'y trouve vient d'un autre age, pas de la fraiche.
    dunes-d-ambre: { weight_shift: 15 }

    # On n'y recolte pas, on y **retrouve**. Le premier avant-gout de l'Etale.
    cite-ensevelie: { weight_shift: 20 }

    # ------------------------------------------------------------------------
    # Les zones du Silence (ZON-40)
    # ------------------------------------------------------------------------
    # Elles portaient des filons du perimetre de purete — la gemme de sel, le
    # filon d'emeraude — **sans signature** : elles tiraient donc comme la Foret,
    # la zone de reference du monde de depart. Deux zones de bout de carte qui
    # rendent exactement ce que rend la premiere foret venue, c'est GAME_ZONES §4
    # contredit en silence.

    # Le sel **conserve**, comme l'ambre des Dunes, et il concentre en plus : ce
    # qui a resiste a l'evaporation est ce qu'il y avait de plus dense. Signature
    # haute, un cran sous la Cite ensevelie — on y retrouve moins qu'on y
    # ramasse.
    mer-de-sel: { weight_shift: 18 }

    # Le prolongement de la Crete, et sa logique poussee d'un cran : le vent y a
    # emporte le meuble, le gel fige ce qui reste. Juste sous la Crete, dont il
    # est le col — le monde ne se remet pas a zero quand on franchit une
    # frontiere.
    pas-de-givre: { weight_shift: 22 }

    # Le Glacier du Silence n'a **pas** de signature, et c'est correct : aucun de
    # ses filons n'entre dans le perimetre de purete (deux plantes). Une
    # signature y serait un parametre que personne ne lit.
