# Definition declarative des zones du World 1 (pivot PBBG, ZON-11).
#
# Source de verite unique du graphe de zones : les fixtures (ZoneGraphFixtures)
# ET la commande `app:zone:import` lisent ce fichier. Ajouter du contenu =
# ajouter de la donnee ici, pas du code.
#
# Format complet documente dans DOCUMENTATION.md, section « Configuration
# declarative de zone (ZON-11) ». Rappel des cles :
#   zones.<slug>:
#     name / name_en                identite (name_en -> nameTranslations.en)
#     description / description_en  texte (description_en -> descriptionTranslations.en)
#     type                          city | wilderness | interior | dungeon
#     safe                          true = aucune rencontre hostile
#     tier                          palier de la zone (BES-01, GAME_ZONES §2) : 0 (sur) a 4.
#                                   Meme vocabulaire que les profils de filon, les bandes de
#                                   purete et les rangs de foyer. Le palier d'un monstre est
#                                   celui de la zone qui le place (ecarts explicites : fond
#                                   des Mines T4, sommet de la Crete T4). Defaut : 0.
#     map_x / map_y                 position sur la carte du monde illustree (ZON-16), % 0-100 ; absent = zone hors carte
#     map_shape                     contour cliquable sur cette meme carte : points « x,y » separes
#                                   par des espaces, dans le MEME espace 0-100 que map_x/map_y
#                                   (format `points` d'un <polygon> SVG). Minimum 3 points, valide
#                                   a l'import. Absent = la zone n'a que sa pastille pour cible, et
#                                   le brouillard de guerre ne s'y perce pas.
#
#                                   Les contours livres sont traces A LA MAIN contre
#                                   `assets/styles/images/world-map/world-1.webp` : ce sont des
#                                   approximations du dessin, pas une verite geometrique. Deux
#                                   consequences assumees — les polygones se chevauchent
#                                   legerement aux frontieres, et le centre declare du Marais
#                                   (32,74) comme celui des Dunes (30,78) tombe pres de leur
#                                   frontiere commune, l'illustration ayant fondu les deux
#                                   biomes l'un dans l'autre. Retracer un contour = editer
#                                   cette ligne, rien d'autre.
#     illustration                  bandeau de la zone (ZON-41), sous `public/images/`.
#                                   Forme close et unique : `zones/<slug>.webp`, ou <slug> est
#                                   celui de la zone. Toute autre valeur casse l'import — un
#                                   champ qui part dans un attribut `src` ne doit pas pouvoir
#                                   designer autre chose qu'un bandeau, et une image ne doit
#                                   pas pouvoir se retrouver sur la mauvaise zone.
#                                   Absent = pas de bandeau, et c'est la norme tant que
#                                   l'image n'existe pas. Un chemin declare dont le fichier
#                                   manque sur le disque produit un AVERTISSEMENT d'import,
#                                   jamais une erreur : les douze bandeaux arrivent un par un.
#     enabled                       (optionnel, defaut true)
#     source_map                    nom de la Map TMX d'origine (legacy, optionnel)
#     explore:                      table de rencontres / loot (optionnel -> defauts service)
#       weights: { mob, chest, harvest, pnj, nothing }
#       chest_gils_min / chest_gils_max
#     mobs:                         population de creatures (ZON-26b, optionnel)
#       - { monster, count, nocturnal, group_tag }
#       Seul chemin pour peupler une zone SANS carte d'origine : `Mob.zone`
#       etait sinon derive de `Mob.map` via `Zone::sourceMap`.
#     gather:                       filons recoltables partages (optionnel)
#       - { slug, item, profession, capacity, respawn_seconds, yield_min, yield_max }
#         requires_skill            (optionnel, ECO-24c) slug d'une competence
#                                   exigee pour exploiter CE filon. Absent = filon
#                                   ouvert a tous : le gate est opt-in, rien de ce
#                                   qui etait accessible ne se ferme. Le filon reste
#                                   VISIBLE pour qui ne l'a pas — la zone montre ce
#                                   que le personnage sait, et un filon qu'on voit
#                                   sans pouvoir l'ouvrir est une raison d'apprendre.
#
#       CALIBRAGE DES FILONS — cf. docs/GAME_ZONE_ACTIONS.md §6.5-6.6
#       Ne pas poser de valeurs a la main : reprendre un profil de palier.
#       Le levier economique est le **debit soutenu** R = capacity x 3600 /
#       respawn_seconds (unites/heure). `capacity` n'est qu'un **tampon** : ce
#       qu'un afflux de joueurs absorbe avant que la vitalite touche son
#       plancher. Un tampon trop petit — c'etait le defaut de la calibration
#       d'origine — fait qu'un seul joueur vide le filon, et le joueur
#       occasionnel ne voit plus jamais la ressource.
#
#       Depuis ZON-37 la repousse est un **debit continu** : le stock remonte au
#       prorata du temps ecoule, il n'y a plus de phase de respawn. Le nombre
#       parlant est donc l'**intervalle de goutte** (respawn / capacity) ; la
#       periode de remplissage complet n'est plus qu'une consequence.
#
#       Recalibrage du 2026-07-28 (BALANCE §22.3, cible ~50 joueurs/jour) : le
#       monde soutenait 2 200 recolteurs pour une charge reelle de 25, soit 1 %
#       d'utilisation. Toute la couche de rarete etait inerte — purete toujours
#       au maximum, Paleur mecaniquement impossible.
#
#       | Palier          | capacity | periode | 1 unite / | rendement | R (u/h) | recolteurs |
#       |-----------------|---------:|--------:|----------:|-----------|--------:|-----------:|
#       | T0 fondation    |       72 |     7 h |  5 min 50 | 1-3       |    10,3 |       12,3 |
#       | T1 commun       |       60 |     9 h |     9 min | 1-3       |     6,7 |        8,0 |
#       | T2 peu commun   |       32 |     8 h |    15 min | 1-2       |     4,0 |        4,8 |
#       | T3 rare         |       24 |    10 h |    25 min | 1-2       |     2,4 |        2,9 |
#       | T4 epique       |       22 |    18 h |    49 min | 1-2       |     1,2 |        1,5 |
#       | A affleurement  |       16 |     6 h |    22 min | 1-1       |     2,7 |        3,2 |
#
#       Le profil **A** n'est pas un palier : c'est l'amethyste, et elle n'en a
#       pas (ZON-40, GAME_WORLD § 13.3 — aucun gisement, un sous-produit
#       universel). Son tampon est le plus petit du monde parce qu'elle
#       **affleure** — on n'en fait pas une rafale de trente (GAME_ZONES, loi 8) —
#       et son debit reste franc parce qu'elle est **partout**. Ces deux
#       proprietes vont ensemble : c'est ce qui la distingue d'un filon rare.
#       Elle ne figure donc pas dans la ligne du metal, et la loi des raretes
#       inversees (ZoneLawsTest) ne s'y applique pas.
#
#       La **periode** n'est pas monotone (9 h en T1 contre 8 h en T2) : c'est
#       normal, elle n'est pas la variable de conception. Le tampon decroit plus
#       vite que le debit vise d'un palier a l'autre, parce qu'il est verrouille
#       par le bas (GAME_ZONE_ACTIONS §6.5 : il doit resister a la rafale d'un
#       joueur seul, ~30 unites). L'intervalle de goutte, lui, est bien monotone.
#
#       « recolteurs » = joueurs reguliers soutenus, a 20 recoltes/jour sur ce
#       filon (un joueur dispose de 80 recoltes/jour a 240 energie / 3).
#       T0 reste le plus genereux : il gate le plancher T1 de l'economie
#       (cuivre, etain, menthe, truite) et ne doit jamais etre un goulot.
#       La rarete se regle par le **palier** et le **gate de competence**, pas en
#       etranglant la capacite.
#   connections:
#     - { from, to, travel_seconds, bidirectional, requires_discovery, enabled }

zones:
    # =========================================================================
    # ZONE 1 — Le Fanal (hub, zone sure)
    # =========================================================================
    #
    # Le point de depart de tout personnage, et le seul lieu ou l'on ne risque
    # rien. `safe: true` fait forcer le poids `mob` a 0 par `ExploreService` :
    # declarer une population ici n'aurait aucun effet, d'ou l'absence de bloc
    # `mobs:`.
    village-de-lumiere:
        name: 'Le Fanal'
        name_en: 'The Beacon'
        description: "Le hub central du World 1. Le feu du haut de la tour n'a jamais ete laisse s'eteindre, et c'est de lui que le village tient son nom : la forge, les echoppes, les jardins du temple et les voyageurs de passage. Ici, rien ne mord."
        description_en: 'The central hub of World 1. The fire atop the tower has never been let go out, and the village takes its name from it: the forge, the shops, the temple gardens and passing travelers. Nothing bites here.'
        type: city
        tier: 0  # palier (BES-01, GAME_ZONES §2)
        safe: true
        map_x: 50
        map_y: 55
        map_shape: '50,43 58,39 66,45 67,56 58,62 50,59 46,50'
        enabled: true
        source_map: 'Le Fanal'
        explore:
            # Ce qu'on trouve en flanant dans un village, ce sont des gens. Sans
            # bloc `explore`, la zone tombait sur les defauts du service (mob 50
            # ramene a 0, puis 40 % de « rien ») : flaner au village ne racontait
            # rien. Le poids `pnj` domine desormais, et `harvest` reste faible —
            # les jardins ci-dessous se recoltent directement, sans reperage.
            weights: { mob: 0, chest: 14, harvest: 10, pnj: 46, nothing: 30 }
            chest_gils_min: 3
            chest_gils_max: 12
            night:
                # Le village dort : les rues se vident, et la bourse oubliee sur
                # un etal a deja trouve preneur.
                weights: { mob: 0, chest: 8, harvest: 6, pnj: 22, nothing: 64 }
                chest_gils_min: 2
                chest_gils_max: 8
        gather:
            # Jardins du temple — palier T0 (cf. tableau en tete de fichier).
            #
            # Meme diagnostic que la camomille d'ECO-02 : le thym et la lavande
            # n'avaient **aucune source** dans le monde livre alors qu'ils gatent
            # les deux premieres recettes d'alchimie que rencontre un joueur —
            # `recipe-antidote` (niveau 2, 1x lavande) et `recipe-healing-medium`
            # (niveau 2, 2x thym), plus `recipe-elixir-defense` (niveau 3, 2x
            # thym). Les poser en zone sure au palier T0, c'est garantir que le
            # plancher T1 de l'economie ne dependra jamais d'une zone hostile.
            - { slug: carre-de-thym, item: plant-thyme, profession: herbalism, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            - { slug: bordure-de-lavande, item: plant-lavender, profession: herbalism, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            # ONB-10 — **et pourquoi le minerai n'est pas ici.**
            #
            # Le Fanal n'expose que de l'herboristerie, et ce n'est pas un oubli.
            # Une carriere au pied du rempart aurait rapproche la cinquieme
            # recolte du hub, mais toute la ligne du cristal porte le prefixe
            # `ore-` (`config/game/purity.yaml`), et le Cristal sous la Voute est
            # **un cœur, pas un gisement** : on vit a cote de la plus grande
            # amethyste du monde et on n'en ramasse pas un eclat.
            #
            # La cinquieme recolte vit donc a une liaison d'ici — et c'est le
            # **premier voyage offert** qui la rend atteignable sans attendre.
        pnjs:
            # Habitants declares (ZON-26b-b). Ils **completent** les sept PNJ de
            # `VillageHubPnjFixtures` (forgeron, alchimiste, marchand, maitresse
            # des quetes, banquier, garde, guide) : ceux-la portent des arbres de
            # dialogue et des chaines de quete, que le YAML ne sait pas decrire.
            # Ici, on ajoute des figures de fond — une replique, parfois un etal.
            - slug: village-jardiniere-fioline
              name: 'Fioline, jardiniere du temple'
              name_en: 'Fioline, Temple Gardener'
              class_type: villager
              greeting: "Le thym pousse le long du mur sud, la lavande sur la bordure. Sers-toi — mais laisse-en pour le suivant."
              # Plancher T1 PNJ (cf. docs/GAME_PRINCIPLES.md) : les herbes de base
              # restent achetables meme quand les carres sont a sec.
              shop_items: [plant-thyme, plant-lavender, plant-mint]
              opens_at: 7
              closes_at: 18
            - slug: village-crieur-hesper
              name: 'Hesper le crieur public'
              name_en: 'Hesper the Town Crier'
              class_type: villager
              greeting: "Avis ! La foret bruisse plus qu'a l'ordinaire, et les mines rendent moins de fer qu'au printemps. Voila pour les nouvelles."
            - slug: village-veilleur-tancrede
              name: 'Tancrede, veilleur de nuit'
              name_en: 'Tancred, Night Watchman'
              class_type: guard
              life: 60
              greeting: "Dors si tu peux. Moi, je compte les heures jusqu'a l'aube — et je vends de quoi les tenir."
              shop_items: [beer-pint, bread, grilled-meat]
              # Horaire a cheval sur minuit : `Pnj::isShopOpen` traite le cas
              # `opens_at > closes_at` comme une plage nocturne (20h -> 6h).
              opens_at: 20
              closes_at: 6

    # =========================================================================
    # ZONE 2 — Foret des murmures (premiere zone hostile)
    # =========================================================================
    #
    # La zone ou l'on apprend a se battre et a recolter. Population et habitants
    # sont **declares** ici : jusqu'a ZON-26b ils venaient de la carte TMX
    # d'origine via `MobFixtures`, ce qui melait deux sources de verite pour un
    # meme contenu.
    foret-des-murmures:
        name: 'Forêt des Murmures'
        name_en: 'Whispering Forest'
        description: "Arbres centenaires, clairieres et riviere aux eaux vives. On y apprend a se battre et a cueillir — et, la nuit venue, a ne pas s'attarder."
        description_en: 'Ancient trees, clearings and a river of quick water. Here one learns to fight and to forage — and, once night falls, not to linger.'
        type: wilderness
        tier: 1
        safe: false
        map_x: 28
        map_y: 38
        map_shape: '12,22 24,15 40,17 50,26 47,36 36,41 24,42 13,36'
        enabled: true
        source_map: 'Forêt des Murmures'
        explore:
            weights: { mob: 45, chest: 12, harvest: 12, pnj: 8, nothing: 23 }
            chest_gils_min: 5
            chest_gils_max: 25
            # Variance jour/nuit (ZON-17) : la nuit, la foret devient plus hostile,
            # le butin des coffres plus genereux, et des morts-vivants nocturnes
            # (fantomes, squelettes) remplacent le vivier diurne quand ils sont presents.
            night:
                weights: { mob: 65, chest: 15, harvest: 5, pnj: 2, nothing: 13 }
                chest_gils_min: 10
                chest_gils_max: 40
                # Ce pool ne filtre que les creatures **presentes dans la zone**
                # (`ExploreService::resolveMob` retombe sur le vivier complet si le
                # filtre ne rend rien). Le squelette etait declare ici sans jamais
                # avoir ete peuple : le bloc `mobs:` ci-dessous le corrige.
                mob_slugs: [ghost, skeleton]
        gather:
            - { slug: herbes-de-la-foret, item: plant-mint, profession: herbalism, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            - { slug: sauge-sauvage, item: plant-sage, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            - { slug: ginseng-des-sous-bois, item: plant-ginseng, profession: herbalism, capacity: 32, respawn_seconds: 28800, yield_min: 1, yield_max: 2 }
            - { slug: truites-de-riviere, item: fish-trout, profession: fishing, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            # ZON-40 — l'affleurement d'amethyste. La Foret est la **reference**
            # du monde (`config/game/purity.yaml`) : c'est contre elle que les
            # signatures des autres zones se lisent. Elle n'avait aucun filon du
            # perimetre de purete, donc la reference elle-meme etait
            # ininstanciable — on comparait a un etalon qui n'existait pas.
            - { slug: affleurement-d-amethyste-des-clairieres, item: ore-amethyst-crystal, profession: mining, capacity: 16, respawn_seconds: 21600, yield_min: 1, yield_max: 1 }
            # ECO-02 : la camomille n'avait aucune source dans le monde livre, ce
            # qui rendait `recipe_potion_base` — la premiere recette d'alchimie —
            # impossible a realiser.
            - { slug: camomille-des-clairieres, item: plant-chamomile, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            # Correctif 128b : ces herbes nourrissaient 8 recettes d'alchimie de
            # niveau 2 a 10 et n'etaient recoltables nulle part. Elles rejoignent
            # les zones de depart — les gater derriere l'Acte 4 aurait mis une
            # recette de niveau 2 hors de portee jusqu'au niveau 30.
            - { slug: aloes-des-clairieres, item: plant-aloe-vera, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            # Meme correctif, applique aux plantes restees orphelines : le romarin
            # alimente un enchantement, le pissenlit et l'echinacee ne poussaient
            # nulle part. La foret est leur biome naturel — et la premiere zone
            # ou un joueur ouvre l'arbre d'herboristerie.
            - { slug: romarin-des-lisieres, item: plant-rosemary, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            - { slug: pissenlits-des-clairieres, item: plant-dandelion, profession: herbalism, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            - { slug: echinacee-des-fourres, item: plant-echinacea, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            # Le second poisson de la riviere, palier T2 : la truite nourrit le
            # plancher, le saumon donne une raison de revenir avec un meilleur
            # niveau de peche.
            - { slug: saumons-des-rapides, item: fish-salmon, profession: fishing, capacity: 32, respawn_seconds: 28800, yield_min: 1, yield_max: 2 }
            # ZON-34 — la seconde source de hetre, et l'arbre de la zone-titre.
            # Le chene murmurant est l'**exclusivite** de la Foret : il porte
            # son nom, il n'aurait pas pu pousser ailleurs.
            - { slug: hetraie-des-lisieres, item: wood-beech, profession: woodcutting, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            - { slug: chenes-murmurants, item: wood-whisperoak, profession: woodcutting, capacity: 32, respawn_seconds: 28800, yield_min: 1, yield_max: 2, requires_skill: lumber-whisperoak-xs }
        # Population declaree (ZON-26b). Elle remplace les spawns que
        # `MobFixtures` posait sur la carte TMX `map_3` : deux sources de verite
        # pour un meme contenu, dont une invisible depuis ce fichier.
        #
        # Le `count` est un **effectif**, pas une espece : quatre gelees sont
        # quatre rencontres possibles, et un combat en cours n'asseche pas la
        # zone pour les autres joueurs.
        mobs:
            # Vivier diurne — la marche de progression de la zone, du niveau 1
            # (gelee, loup, scarabee) au niveau 4 (loup alpha).
            - { monster: slime, count: 4 }
            # BES-03 : especes que seule la carte de test placait — le graphe
            # declaratif devient la source unique de la faune.
            - { monster: goblin, count: 3 }
            - { monster: taiju, count: 2 }
            - { monster: wolf, count: 4, group_tag: meute-des-murmures }
            - { monster: beetle, count: 3 }
            - { monster: spider, count: 3 }
            - { monster: venom_snake, count: 3 }
            - { monster: scorpion, count: 2 }
            - { monster: mushroom_golem, count: 2 }
            - { monster: ochu, count: 2 }
            - { monster: undine, count: 2 }
            - { monster: sylph, count: 2 }
            - { monster: salamander, count: 1 }
            - { monster: alpha_wolf, count: 1, group_tag: meute-des-murmures }
            # Vivier nocturne — c'est lui que `explore.night.mob_slugs` restreint.
            # Le squelette manquait : le pool nocturne le nommait sans qu'aucun
            # individu n'existe, et le filtre retombait silencieusement sur le
            # vivier diurne.
            - { monster: skeleton, count: 3, nocturnal: true }
            - { monster: ghost, count: 3, nocturnal: true }
            - { monster: will_o_wisp, count: 2, nocturnal: true }
            - { monster: creeping_shadow, count: 1, nocturnal: true }
            # Rencontre sommitale de la zone. Son pendant minier est le Seigneur
            # de la Forge ; toutes deux debloquent une entree de Codex au kill.
            - { monster: forest_guardian, count: 1 }
        pnjs:
            # Completent les cinq PNJ de `ForestPnjFixtures` (garde forestier,
            # herboriste, ermite, bucheron, chasseuse), qui portent les arbres de
            # dialogue de l'Acte 2 et restent donc en PHP.
            - slug: foret-pecheur-tobin
              name: 'Tobin, pecheur des rapides'
              name_en: 'Tobin, Rapids Fisherman'
              class_type: merchant
              greeting: "La truite mord toute l'annee. Le saumon, lui, se merite — remonte jusqu'aux rapides si tu veux le voir."
              shop_items: [fishing-rod-bronze, healing-potion-small, bread]
              opens_at: 5
              closes_at: 20
            - slug: foret-veilleuse-morrigane
              name: 'Morrigane, veilleuse des lisieres'
              name_en: 'Morrigane, Edge Watcher'
              class_type: hunter
              life: 45
              greeting: "Le jour, la foret n'est qu'une foret. Apres le crepuscule, ce qui marche entre les arbres n'a plus de souffle. Rentre."

    # =========================================================================
    # ZONE 3 — Mines Profondes (extraction, palier au-dessus de la foret)
    # =========================================================================
    #
    # La zone d'extraction du monde de depart : c'est d'ici que sort la matiere
    # premiere de toute la chaine de forge. La recolte y prime sur la rencontre,
    # et le sous-sol ne connait pas le jour — mais les galeries desertees, si.
    mines-profondes:
        name: 'Mines Profondes'
        name_en: 'Deep Mines'
        description: "Tunnels etayes, bassins noirs et filons a perte de galerie. On y descend pour le minerai ; ce qui remonte n'est pas toujours ce qu'on y a laisse."
        description_en: 'Propped tunnels, black pools and veins running the length of the gallery. One goes down for ore; what comes back up is not always what was left there.'
        type: wilderness
        tier: 2
        safe: false
        map_x: 72
        map_y: 36
        map_shape: '62,30 76,28 90,29 99,28 99,44 88,47 74,45 64,40'
        enabled: true
        source_map: 'Mines Profondes'
        explore:
            # Zone d'extraction : la recolte prime sur la rencontre, et les
            # coffres (caches de mineurs) sont plus genereux qu'en foret.
            weights: { mob: 38, chest: 18, harvest: 24, pnj: 4, nothing: 16 }
            chest_gils_min: 10
            chest_gils_max: 40
            night:
                # Les galeries desertees reveillent les constructs.
                weights: { mob: 58, chest: 20, harvest: 8, pnj: 1, nothing: 13 }
                chest_gils_min: 15
                chest_gils_max: 60
                mob_slugs: [clay_golem, rusty_automaton, stone_golem]
        gather:
            - { slug: filon-de-cuivre, item: ore-copper, profession: mining, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            # ECO-02 : l'etain n'avait aucune source. Sans lui, pas de lingot de
            # bronze — donc aucun outil de bronze, et toute la chaine d'outillage
            # T1 restait hors d'atteinte.
            - { slug: filon-d-etain, item: ore-tin, profession: mining, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            - { slug: filon-de-fer, item: ore-iron, profession: mining, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            - { slug: veine-d-or, item: ore-gold, profession: mining, capacity: 32, respawn_seconds: 28800, yield_min: 1, yield_max: 2 }
            # ECO-24b — le sombracier, au fond des galeries (GAME_ZONES §2.4 et §3).
            # « Le metal du temps le plus tasse » : la mine est la zone ou le plus
            # de temps s'est depose, et le fond en est le point extreme.
            # Intrant du lingot d'adamantite : l'Extension 1 y renverra ses
            # vetérans — levier 1 contre le creux du milieu (GAME_WORLD §5.5).
            # ECO-24c — le premier filon gate du monde. `miner-darksteel-xs`
            # cessait d'ouvrir quoi que ce soit depuis le pivot : elle citait un
            # `spot-*` de l'ancien systeme de carte.
            - { slug: veine-de-sombracier-du-fond, item: ore-darksteel, profession: mining, capacity: 22, respawn_seconds: 64800, yield_min: 1, yield_max: 2, requires_skill: miner-darksteel-xs }
            # L'anguille electrique n'avait aucune source. Les bassins noyes des
            # galeries basses lui donnent son biome, et la mine sa premiere
            # ressource de peche — jusqu'ici l'extraction y etait le seul metier
            # de recolte represente. Palier T3 : on ne descend pas pecher par
            # hasard.
            - { slug: bassins-aux-anguilles, item: fish-electric-eel, profession: fishing, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2 }
        # Population declaree (ZON-26b), en remplacement des spawns de la carte
        # TMX `map_4`. La mine monte plus haut que la foret : on y croise du
        # niveau 1 pres du carreau et du niveau 24 au fond.
        mobs:
            # Carreau et premieres galeries.
            - { monster: bat, count: 4 }
            - { monster: giant_rat, count: 3 }
            - { monster: clay_golem, count: 3 }
            - { monster: stone_golem, count: 3 }
            # Galeries centrales — la patrouille d'automates est le premier
            # groupe organise que rencontre un joueur.
            # Une seule entree par espece : `ZoneImporter::syncMobs` complete
            # jusqu'au `count` declare en comptant les individus deja en base,
            # et deux entrees pour un meme monstre rendraient l'effectif final
            # dependant de l'ordre des flushs.
            - { monster: rusty_automaton, count: 4, group_tag: patrouille-de-la-mine }
            - { monster: gargoyle, count: 2 }
            - { monster: crystal_golem, count: 2 }
            # Salles profondes.
            - { monster: abyssal_blacksmith, count: 1 }
            # Vivier nocturne. `explore.night.mob_slugs` restreint les rencontres
            # aux constructs (golems et automates) : le chevalier maudit et la
            # liche restent des rencontres de fond, pas le theme de la nuit.
            - { monster: cursed_knight, count: 2, nocturnal: true }
            - { monster: lesser_lich, count: 1, nocturnal: true }
            # Rencontre sommitale de la zone, pendant du Gardien de la Foret.
            - { monster: forge_lord, count: 1 }
        pnjs:
            # Completent les cinq PNJ de `MinesPnjFixtures` (contremaitre,
            # ingenieure, marchand souterrain, guerisseuse, vieux prospecteur).
            # Sous terre, les horaires n'ont pas de sens : les etals miniers
            # ouvrent en continu (pas de `opens_at` / `closes_at`).
            - slug: mines-cantiniere-brida
              name: 'Brida, cantiniere du carreau'
              name_en: 'Brida, Pithead Cook'
              class_type: merchant
              greeting: "Descends le ventre plein ou ne descends pas. La galerie ne rend pas ce qu'elle prend."
              shop_items: [stew, grilled-meat, bread, beer-pint]
            - slug: mines-porteur-de-lanterne-kolm
              name: 'Kolm, porteur de lanterne'
              name_en: 'Kolm, Lantern Bearer'
              class_type: villager
              greeting: "Je marche devant, tu marches derriere. Si ma lampe s'eteint, ne cours pas : ecoute."

    marais-brumeux:
        name: 'Marais Brumeux'
        name_en: 'Misty Swamp'
        description: 'Brume epaisse et eaux stagnantes ; des creatures corrompues rodent.'
        description_en: 'Thick mist and stagnant waters; corrupted creatures lurk.'
        type: wilderness
        tier: 2
        safe: false
        map_x: 32
        map_y: 74
        map_shape: '4,58 14,54 26,57 33,64 34,74 22,80 8,78'
        source_map: 'Marais Brumeux'
        explore:
            # Terrain hostile et pauvre en butin : on y vient pour ses plantes.
            weights: { mob: 48, chest: 8, harvest: 20, pnj: 4, nothing: 20 }
            chest_gils_min: 5
            chest_gils_max: 30
            night:
                # La brume nocturne appartient aux creatures corrompues.
                weights: { mob: 68, chest: 10, harvest: 6, pnj: 1, nothing: 15 }
                chest_gils_min: 10
                chest_gils_max: 45
                mob_slugs: [will_o_wisp, creeping_shadow, specter]
        mobs:
            # ZON-26b — le Marais cesse de tenir sa population de sa carte TMX.
            # Les seize individus places a la main sur `map_5` deviennent une
            # declaration : meme faune, meme repartition jour/nuit, mais lisible
            # et modifiable sans toucher a une fixture PHP.
            #
            # La progression de la zone se lit dans l'ordre : la lisiere donne du
            # zombie et de l'araignee, les chemins de l'ochu et de l'undine, les
            # eaux profondes la naga et l'archidruide corrompu.
            - { monster: zombie, count: 1 }
            - { monster: spider, count: 2 }
            - { monster: venom_snake, count: 1 }
            - { monster: ochu, count: 2 }
            - { monster: mushroom_golem, count: 1 }
            - { monster: undine, count: 1 }
            - { monster: naga, count: 1 }
            - { monster: corrupted_archdruid, count: 1 }
            # Le boss de zone vit dans la population comme partout ailleurs
            # (la Foret declare son gardien de la meme facon).
            - { monster: swamp_hydra, count: 1 }
            # La nuit du Marais : les trois especes du pool nocturne y vivent,
            # plus le fantome et la banshee qui ne s'y reservent pas.
            - { monster: ghost, count: 1, nocturnal: true }
            - { monster: specter, count: 1, nocturnal: true }
            - { monster: banshee, count: 1, nocturnal: true }
            # BES-03 : le loup-garou et le necromancien quittent la carte de
            # test pour la nuit du Marais, leur palier (T2).
            - { monster: werewolf, count: 2, nocturnal: true }
            - { monster: necromancer, count: 1, nocturnal: true }
            - { monster: will_o_wisp, count: 1, nocturnal: true }
            - { monster: creeping_shadow, count: 1, nocturnal: true }
        gather:
            - { slug: ortie-des-marais, item: plant-nettle, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            - { slug: valeriane-des-tourbieres, item: plant-valerian, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            # Pire cas des quatre : une quete en demande deux exemplaires.
            - { slug: mandragore-des-tourbieres, item: plant-mandrake, profession: herbalism, capacity: 32, respawn_seconds: 28800, yield_min: 1, yield_max: 2 }
            - { slug: carpes-stagnantes, item: fish-carp, profession: fishing, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            # ZON-40 — l'affleurement d'amethyste, et **la promesse phare du
            # modele de purete** : « le Marais nocturne est le premier endroit ou
            # un joueur d'Acte II voit du Pur » (GAME_ZONES § 2.5). Le
            # `night_weight_shift: 30` de la table etait ecrit depuis ZON-32 et
            # ne s'appliquait a rien — la zone n'avait aucun filon du perimetre
            # de purete. C'est ce filon qui rend la promesse instanciable.
            - { slug: affleurement-d-amethyste-des-tourbieres, item: ore-amethyst-crystal, profession: mining, capacity: 16, respawn_seconds: 21600, yield_min: 1, yield_max: 1 }
            - { slug: spores-fantomes, item: plant-ghostshroom, profession: herbalism, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2 }
            - { slug: belladone-des-tourbieres, item: plant-nightshade, profession: herbalism, capacity: 32, respawn_seconds: 28800, yield_min: 1, yield_max: 2 }
            # ZON-34 — l'exclusivite du Marais : un bois que l'eau morte a
            # noirci. Il ne pourrit plus, il a deja fini de le faire. Profil T3.
            - { slug: souches-tourbees, item: wood-peat, profession: woodcutting, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2, requires_skill: lumber-peat-xs }
            # ZON-35 — le poisson-lune se reveille. Il etait livre, cuisine par
            # une recette de palier 4 (ECO-29) et **peche nulle part** : le seul
            # poisson du monde dont la source manquait. Profil T4, et gate sur un
            # savoir (ECO-24c) : c'est la prise rare du Marais, celle qu'on ne
            # trouve pas en passant.
            - { slug: poissons-lune, item: fish-moonfish, profession: fishing, capacity: 22, respawn_seconds: 64800, yield_min: 1, yield_max: 1, requires_skill: fisher-moonfish }
            # ZON-33 — les deux plantes que la loi transverse a trouvees. Le
            # champignon veneneux et la racine de marais sont demandes par une
            # quete d'Acte II dont le texte dit « **recoltez** des champignons
            # veneneux et des racines de marais » : le premier ne s'achetait qu'a
            # l'echoppe de Morwen, la seconde n'existait nulle part. Deux zones
            # d'ombre que ZON-35 avait manquees, parce que leurs slugs ne portent
            # pas le prefixe `plant-` sur lequel la loi 9 s'appuyait.
            - { slug: champignons-veneneux, item: poisonous-mushroom, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            - { slug: racines-de-marais, item: swamp-root, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }

    crete-de-ventombre:
        name: 'Crête de Ventombre'
        name_en: 'Shadowind Ridge'
        description: 'Pics balayes par des vents violents ; le sommet abrite les creatures les plus rudes du World 1.'
        description_en: 'Peaks swept by violent winds; the summit shelters the toughest creatures of World 1.'
        type: wilderness
        tier: 3
        safe: false
        map_x: 74
        map_y: 70
        map_shape: '64,48 78,46 92,52 99,66 99,92 86,96 74,86 66,70'
        source_map: 'Crête de Ventombre'
        explore:
            # Zone la plus rude du World 1 : peu de repit, mais les caches des
            # expeditions perdues y sont les mieux garnies.
            weights: { mob: 55, chest: 15, harvest: 12, pnj: 2, nothing: 16 }
            chest_gils_min: 15
            chest_gils_max: 55
            night:
                weights: { mob: 70, chest: 18, harvest: 4, pnj: 0, nothing: 8 }
                chest_gils_min: 25
                chest_gils_max: 80
                mob_slugs: [gargoyle, wyvern, griffin]
        mobs:
            # ZON-26b — la Crete cesse de tenir sa population de sa carte TMX.
            # Les neuf individus de `map_6` deviennent une declaration, dans le
            # meme ordre de rudesse : la base donne du griffon et de la gargouille,
            # les sentiers de l'elementaire de feu, le sommet le minotaure, le
            # troll, et le dragon ancestral.
            - { monster: griffin, count: 2 }
            - { monster: gargoyle, count: 2 }
            - { monster: fire_elemental, count: 2 }
            - { monster: minotaur, count: 1 }
            - { monster: troll, count: 1 }
            - { monster: dragon, count: 1 }
            # La wyverne arrive avec la declaration, et repare une promesse que
            # personne ne pouvait voir : depuis ZON-17, la nuit de la Crete lui
            # est reservee (`mob_slugs`) alors qu'aucun individu n'y vivait — les
            # deux seules wyvernes du monde etaient posees sur la carte de test.
            # Une nuit qui reserve une espece absente ressemble simplement au
            # jour. Le vent de la crete est d'ailleurs son element.
            - { monster: wyvern, count: 2 }
        gather:
            - { slug: filon-d-argent, item: ore-silver, profession: mining, capacity: 32, respawn_seconds: 28800, yield_min: 1, yield_max: 2 }
            - { slug: filon-de-cobalt, item: ore-cobalt, profession: mining, capacity: 32, respawn_seconds: 28800, yield_min: 1, yield_max: 2 }
            - { slug: givrecoiffe-des-cimes, item: plant-frostcap, profession: herbalism, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2 }
            # ECO-24b — le mithril, sur les strates hautes (GAME_ZONES §2.6 et §3).
            # « Le metal que le vent a mis a nu » : la Crete est le pendant exact
            # des Mines — peu de matiere, mais la plus nette.
            #
            # Ce filon **change une decision** : BALANCE §19 avait fait de la
            # transmutation alchimique la seule source de mithril, faute de filon.
            # GAME_ZONES §3 en pose un. La transmutation reste une seconde voie
            # — c'est ce qui garde a l'alchimie son role economique de haut palier.
            - { slug: filon-de-mithril-du-sommet, item: ore-mithril, profession: mining, capacity: 22, respawn_seconds: 64800, yield_min: 1, yield_max: 2, requires_skill: miner-mithril-xs }

    quartier-des-jardins:
        name: 'Quartier des Jardins'
        name_en: 'Garden Quarter'
        description: "Le lotissement du Fanal : allees de terre battue, murets bas et parcelles a vendre. On y bruit des projets plus que des combats."
        description_en: "The Beacon's residential quarter: dirt lanes, low walls and plots for sale. Plans are hatched here more often than fights."
        type: city
        tier: 0
        safe: true
        map_x: 42
        map_y: 46
        map_shape: '30,44 40,41 48,42 50,48 44,53 34,52 29,48'
        source_map: 'Le Fanal'

    dunes-d-ambre:
        name: 'Dunes d''Ambre'
        name_en: 'Amber Dunes'
        description: "Une mer de sable ocre au sud du marais. Rien n'y pousse, tout y rampe — et la premiere zone du monde a n'avoir jamais eu de carte."
        description_en: 'A sea of ochre sand south of the marshes. Nothing grows there, everything crawls — and the first zone in the world that never had a map.'
        type: wilderness
        tier: 3
        safe: false
        map_x: 30
        map_y: 78
        map_shape: '26,72 40,68 56,70 66,78 62,86 44,88 30,84'
        explore:
            weights: { mob: 50, chest: 12, harvest: 14, pnj: 2, nothing: 22 }
            chest_gils_min: 10
            chest_gils_max: 40
            night:
                weights: { mob: 62, chest: 14, harvest: 6, pnj: 0, nothing: 18 }
                mob_slugs: [scorpion, creeping_shadow]
        # ZON-26b : population declaree. Cette zone n'a **pas** de `source_map` —
        # c'est precisement ce que le chemin declaratif rend possible.
        mobs:
            - { monster: scorpion, count: 4 }
            - { monster: venom_snake, count: 3 }
            - { monster: salamander, count: 2 }
            - { monster: creeping_shadow, count: 2, nocturnal: true }
            # ZON-31 — le gibier a os. La zone etait la plus pauvre du monde
            # livre (un filon, quatre monstres) : sa faune ne rendait **rien**
            # au depeceur, alors que la ligne cuir/os du desert est sa
            # production declaree (GAME_ZONES § 2.7).
            #
            # Le desert se depece en **os**, pas en cuir souple : c'est l'autre
            # moitie de la ligne du tanneur, et l'Acte III la consomme.
            - { monster: dune_ibex, count: 4 }
            - { monster: sand_hyena, count: 3 }
        # ZON-26b-b : habitants declares. Comme les creatures, ils sont rattaches
        # a la zone **directement** : sans ce chemin, une zone sans carte
        # d'origine ne pouvait avoir aucun PNJ, et le tirage `pnj: 2` de son
        # bloc `explore` ci-dessus ne menait a rien.
        pnjs:
            - slug: dunes-caravanier-yazid
              name: 'Yazid le caravanier'
              name_en: 'Yazid the Caravanner'
              class_type: merchant
              greeting: "Le sable avale tout, voyageur. Fais tes emplettes avant qu'il ne t'avale aussi."
              shop_items: [antidote, life-potion, healing-potion-small]
              opens_at: 6
              closes_at: 19
            - slug: dunes-guetteuse-tahira
              name: 'Tahira, guetteuse des dunes'
              name_en: 'Tahira, Dune Watcher'
              class_type: hunter
              life: 40
              greeting: 'Les scorpions sortent au crepuscule. Les ombres, elles, ne dorment jamais.'

        gather:
            - { slug: filon-de-cuivre-des-dunes, item: ore-copper, profession: mining, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            # ECO-24b — le bronze du sud (GAME_ZONES §2.7 et §3).
            # L'etain n'avait qu'un filon au monde alors que le cuivre en avait
            # deux, pour une recette qui exige les deux a parts egales : le
            # bronze etait etrangle par sa moitie la plus rare. La region qui a
            # deja le cuivre replique recoit l'etain — profil T0, comme aux
            # Mines : le plancher de l'economie ne doit jamais etre un goulot.
            - { slug: filon-d-etain-des-dunes, item: ore-tin, profession: mining, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            # Le platine, « metal du fond de mer fossile ». Intrant du lingot de
            # mithril avec le mithril de la Crete : le sommet du jeu de base
            # exige donc un commerce nord-sud (loi des caravanes, GAME_WORLD §5.3).
            - { slug: filon-de-platine-des-dunes, item: ore-platinum, profession: mining, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2, requires_skill: miner-platinum-xs }
            # ZON-31 — l'exclusivite de la zone. « L'Ambre » du nom cesse d'etre
            # un decor : la resine de l'age precedent se degage du sable, et
            # nulle part ailleurs. Profil T3, comme le platine — c'est une
            # matiere qu'on vient chercher, pas une qu'on ramasse en passant.
            #
            # Pas de `requires_skill` : contrairement aux metaux de haut palier
            # (ECO-24c), l'ambre affleure. Le gater fermerait la seule raison de
            # descendre au sud avant l'Acte III.
            - { slug: gisement-d-ambre-fossile, item: amber-fossil, profession: mining, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2 }
            # ZON-34 — l'exclusivite des Dunes, et le seul bois T4 du monde de
            # base : un tronc de l'age precedent que le sable a change en pierre.
            # Meme theme que l'ambre — le desert **conserve** ce qu'il prend.
            - { slug: troncs-petrifies, item: wood-petrified, profession: woodcutting, capacity: 22, respawn_seconds: 64800, yield_min: 1, yield_max: 2, requires_skill: lumber-petrified-xs }

# Liaisons du graphe. `bidirectional: true` cree les deux aretes (durees symetriques).
    # === Acte 4 (tache 128b) ===
    #
    # Deux bras longs partant du monde connu, l'un au sud vers le sel, l'autre
    # au nord vers la glace. Ils ne se rejoignent pas : le desert et la toundra
    # doivent rester loin l'un de l'autre, sinon leurs deux facons de tuer
    # (l'usure et le gel, cf. 128a) se melangent en une seule.

    mer-de-sel:
        name: 'Mer de Sel'
        name_en: 'Salt Sea'
        description: "Une croute blanche a perte de vue, craquelee par la chaleur. Ce qui bouge ici a appris a ne plus avoir soif."
        description_en: 'A white crust as far as the eye can see, cracked by the heat. What moves here has learned to stop being thirsty.'
        type: wilderness
        tier: 4
        safe: false
        map_x: 24
        map_y: 88
        map_shape: '16,80 28,78 40,81 50,86 46,93 30,95 20,89'
        explore:
            weights: { mob: 55, chest: 14, harvest: 10, pnj: 3, nothing: 18 }
            chest_gils_min: 25
            chest_gils_max: 90
            night:
                weights: { mob: 66, chest: 16, harvest: 4, pnj: 0, nothing: 14 }
                mob_slugs: [dune_wraith, basilisk]
        mobs:
            - { monster: sand_stalker, count: 4 }
            - { monster: salt_colossus, count: 3 }
            - { monster: basilisk, count: 2 }
            - { monster: dune_wraith, count: 2, nocturnal: true }
        gather:
            - { slug: gemme-de-sel, item: ore-ruby, profession: mining, capacity: 32, respawn_seconds: 28800, yield_min: 1, yield_max: 2 }
            # ZON-35 — le kraken juvenile se reveille, lui aussi. Le plan des
            # zones prevoyait de le **purger** ; ECO-29 lui a donne entre-temps le
            # festin, la recette de plus haut palier du cuisinier. Supprimer
            # l'item aurait detruit une recette livree : il recoit donc une
            # source plutot qu'une pierre tombale. Profil T4, dans la seule eau
            # profonde du monde.
            - { slug: bancs-de-krakens, item: fish-baby-kraken, profession: fishing, capacity: 22, respawn_seconds: 64800, yield_min: 1, yield_max: 1, requires_skill: fisher-kraken }

    cite-ensevelie:
        name: 'Cité Ensevelie'
        name_en: 'Buried City'
        description: "Des toits qui affleurent le sable. On ne sait pas qui vivait la, et ce qui l'occupe aujourd'hui ne le dira pas."
        description_en: 'Rooftops breaking the surface of the sand. Nobody knows who lived here, and what occupies it today will not say.'
        type: wilderness
        tier: 4
        safe: false
        map_x: 18
        map_y: 96
        map_shape: '2,84 10,84 17,89 20,98 10,100 2,99'
        explore:
            weights: { mob: 58, chest: 18, harvest: 8, pnj: 2, nothing: 14 }
            chest_gils_min: 40
            chest_gils_max: 140
            night:
                weights: { mob: 70, chest: 20, harvest: 2, pnj: 0, nothing: 8 }
                mob_slugs: [dune_wraith, basilisk]
        mobs:
            - { monster: dune_wraith, count: 5 }
            - { monster: basilisk, count: 3 }
            - { monster: sand_stalker, count: 3, group_tag: pillards }
        gather:
            - { slug: fruit-du-vide, item: plant-voidfruit, profession: herbalism, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2 }
            - { slug: eclat-de-diamant, item: ore-diamond, profession: mining, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2 }
            # ECO-24b — l'orichalque, « metal de l'age precedent » (GAME_ZONES
            # §2.8 et §3). La Cite est un donjon, pas un foyer : on ne s'y
            # installe pas, on la fouille. D'ou le profil T4 le plus severe du
            # monde livre — c'est du butin autant que de la recolte.
            - { slug: filon-d-orichalque-ancien, item: ore-orichalcum, profession: mining, capacity: 22, respawn_seconds: 64800, yield_min: 1, yield_max: 2, requires_skill: miner-orichalcum-xs }

    pas-de-givre:
        name: 'Pas de Givre'
        name_en: 'Frostgate Pass'
        description: "Le col au-dela de la crete. Le vent y porte des choses qui hurlent, et le froid ne laisse pas s'arreter."
        description_en: 'The pass beyond the ridge. The wind carries things that howl, and the cold does not let you stop.'
        type: wilderness
        tier: 4
        safe: false
        map_x: 74
        map_y: 14
        map_shape: '52,20 58,13 70,13 88,13 99,10 99,24 84,27 68,26 56,24'
        explore:
            weights: { mob: 56, chest: 14, harvest: 12, pnj: 2, nothing: 16 }
            chest_gils_min: 25
            chest_gils_max: 90
            night:
                weights: { mob: 68, chest: 16, harvest: 4, pnj: 0, nothing: 12 }
                mob_slugs: [hoarfrost_shade, frost_warg]
        mobs:
            - { monster: frost_warg, count: 5, group_tag: meute }
            - { monster: winter_harpy, count: 3 }
            - { monster: hoarfrost_shade, count: 2, nocturnal: true }
        gather:
            - { slug: fleur-de-lune-des-neiges, item: plant-moonflower, profession: herbalism, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2 }
            - { slug: filon-d-emeraude, item: ore-emerald, profession: mining, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2 }

    glacier-du-silence:
        name: 'Glacier du Silence'
        name_en: 'Glacier of Silence'
        description: "Rien n'y pousse, rien n'y crie. Ce qu'on entend sous la glace n'a pas de nom, et il vaut mieux ne pas s'arreter pour ecouter."
        description_en: 'Nothing grows, nothing cries out. What is heard beneath the ice has no name, and it is better not to stop and listen.'
        type: wilderness
        tier: 4
        safe: false
        map_x: 80
        map_y: 6
        map_shape: '56,10 64,2 80,0 98,1 99,10 88,13 70,13 58,13'
        explore:
            weights: { mob: 62, chest: 18, harvest: 6, pnj: 0, nothing: 14 }
            chest_gils_min: 40
            chest_gils_max: 150
            night:
                weights: { mob: 74, chest: 20, harvest: 2, pnj: 0, nothing: 4 }
                mob_slugs: [rime_drake, hoarfrost_shade]
        mobs:
            - { monster: permafrost_golem, count: 3 }
            - { monster: hoarfrost_shade, count: 3 }
            - { monster: rime_drake, count: 2 }
            - { monster: winter_harpy, count: 2, nocturnal: true }
        gather:
            - { slug: feuille-de-dragon-gelee, item: plant-dragonleaf, profession: herbalism, capacity: 24, respawn_seconds: 36000, yield_min: 1, yield_max: 2 }
            - { slug: fleur-de-phenix, item: plant-phoenixflower, profession: herbalism, capacity: 22, respawn_seconds: 64800, yield_min: 1, yield_max: 2 }

    # =========================================================================
    # ZONE 12 — Vallons d'Aubepine (la zone-ecole du depeceur, ZON-30)
    # =========================================================================
    #
    # Declaree en dernier parce que le fichier suit l'ordre de livraison, pas
    # l'ordre du monde : les Vallons se lisent geographiquement entre le hub et
    # la Foret (GAME_ZONES § 2.2).
    #
    # **Ce qu'elle repare.** Le depecage n'avait aucun terrain d'apprentissage a
    # portee du hub : la faune de la Foret est disputee par tout le serveur et
    # melee de creatures non depecables. Les Vallons donnent au debutant une
    # faune **entierement depecable** et calme.
    #
    # **Ce qu'elle apporte au monde.** Le lin est son **exclusivite** (loi 1) :
    # aucune autre zone n'en produira. C'est ce qui ramenera un veteran dans une
    # zone d'Acte I le jour ou le textile aura besoin de fibre.
    #
    # **Aucun filon n'y est un goulot** : les profils sont T0 et T1, les deux
    # paliers les plus genereux du calibrage (BALANCE § 22.3).
    vallons-d-aubepine:
        name: "Vallons d'Aubépine"
        name_en: 'Hawthorn Vales'
        description: "Bocage et riviere a une demi-heure du Fanal. Des haies d'aubepine, des pres, des vergers, un gue. Le grenier du monde — et le premier endroit ou l'on comprend qu'il se cultive."
        description_en: 'Hedgerow and river half an hour from the Beacon. Hawthorn hedges, meadows, orchards, a ford. The granary of the world — and the first place where one understands that it is farmed.'
        type: wilderness
        tier: 1
        safe: false
        map_x: 38
        map_y: 60
        map_shape: '24,53 34,50 44,54 47,61 42,68 32,68 24,63'
        enabled: true
        explore:
            # Une zone douce : on y croise plus de gens et de recoltes que de
            # betes. Le contraste avec la Foret est la raison d'etre du lieu.
            weights: { mob: 30, chest: 10, harvest: 26, pnj: 12, nothing: 22 }
            chest_gils_min: 4
            chest_gils_max: 18
            night:
                # **La nuit des Vallons est calme**, et c'est acte (GAME_ZONES
                # § 2.2) : aucun nocturne agressif, pas de `mob_slugs` qui
                # restreindrait le vivier a des creatures de nuit. On entend la
                # hulotte, on ne la combat pas.
                weights: { mob: 20, chest: 12, harvest: 22, pnj: 4, nothing: 42 }
                chest_gils_min: 6
                chest_gils_max: 24
        gather:
            # Les carres de ble — profil T0, le plus genereux. Le ble ouvre la
            # chaine de cuisine joueur, aujourd'hui entierement PNJ.
            - { slug: carres-de-ble, item: plant-wheat, profession: herbalism, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            # Les linieres — profil T1, et **l'exclusivite de la zone**.
            - { slug: linieres-du-gue, item: plant-flax, profession: herbalism, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            # Le gue — la peche d'apprentissage, entre la truite et la carpe.
            - { slug: perches-du-gue, item: fish-perch, profession: fishing, capacity: 60, respawn_seconds: 32400, yield_min: 1, yield_max: 3 }
            # ZON-40 — l'affleurement d'amethyste. La signature des Vallons dit
            # « la strate la plus jeune du monde : le debutant y apprend qu'il
            # **existe** de l'amethyste, pas ou la chercher pure » — encore
            # fallait-il qu'il puisse en ramasser une seule fois.
            - { slug: affleurement-d-amethyste-des-labours, item: ore-amethyst-crystal, profession: mining, capacity: 16, respawn_seconds: 21600, yield_min: 1, yield_max: 1 }
            # ZON-34 — la ligne du bois. Le hetre a **deux** sources (ici et la
            # Foret) et ne doit jamais etre un goulot : c'est le T0 de sa ligne,
            # au meme titre que le cuivre pour le metal.
            - { slug: hetraie-des-vallons, item: wood-beech, profession: woodcutting, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
            # La troisieme source de cuivre, promise par GAME_ZONES § 3 et jamais
            # posee : ZON-30 a livre les Vallons sans elle. Le monde n'en avait
            # que deux — les Mines profondes et les Dunes d'Ambre —, c'est-a-dire
            # une zone hostile de palier haut et l'autre bout de la route du sud.
            # Le premier metal de toutes les chaines d'artisanat n'etait donc
            # accessible qu'apres un vrai voyage.
            #
            # Ici, il tient a la loi du temps de la zone : les Vallons sont la
            # strate la plus jeune du monde, celle que la charrue retourne. Ce
            # que le champ remonte, c'est l'affleurement d'amethyste (ZON-40) et
            # le cuivre — le metal le moins profond. Profil T0, comme le ble et
            # le hetre : la zone-ecole ne fabrique pas de goulot.
            - { slug: filon-de-cuivre-des-labours, item: ore-copper, profession: mining, capacity: 72, respawn_seconds: 25200, yield_min: 1, yield_max: 3 }
        mobs:
            # Toute la faune est depecable, et c'est le point : le depeceur
            # commence ici. Les effectifs disent la densite du bocage — le
            # gibier y est nombreux et peu dangereux.
            - { monster: orchard_vixen, count: 5 }
            - { monster: harvest_crow, count: 5 }
            - { monster: hedge_boar, count: 4 }
            - { monster: hawthorn_stag, count: 3 }
            # « La Foret deborde » : le loup n'appartient pas aux Vallons, il y
            # passe. Un seul, en lisiere.
            - { monster: wolf, count: 1 }
        pnjs:
            - slug: vallons-perrette-meuniere
              name: 'Perrette, meunière du Vieux Moulin'
              name_en: 'Perrette, Miller of the Old Mill'
              class_type: merchant
              # Le plancher d'achat agricole (regle D1) : elle achete le ble
              # quoi qu'il arrive, comme la Fonderie rachete le cristal. Et elle
              # vend le pain **tant que le cuisinier joueur n'existe pas** — le
              # jour ou ECO-29 arrive, elle cesse d'etre la seule.
              greeting: "Apporte-moi ton blé, je te le prends toujours. Le pain, lui, sort du four à l'aube — et il n'attend personne."
              shop_items: [bread, healing-potion-small]
              opens_at: 5
              closes_at: 20
            - slug: vallons-aubin-haiier
              name: 'Aubin le haiier'
              name_en: 'Aubin the Hedger'
              class_type: merchant
              greeting: "Les haies, ça se taille et ça se raconte. Tu vois la bande bleue, là-bas, près du gué ? Du lin. Il n'y en a nulle part ailleurs."
              shop_items: [healing-potion-small]
              opens_at: 6
              closes_at: 19
            - slug: vallons-vieille-brune
              name: 'La Vieille Brune'
              name_en: 'Old Brune'
              class_type: hunter
              # La tutrice naturelle de la quatrieme recolte : c'est elle qui
              # vend le couteau et achete le gibier.
              greeting: "Un cerf, ça ne s'affronte pas, ça se chasse. Reviens avec des peaux, je te dirai si tu as appris quelque chose."
              shop_items: [healing-potion-small]
              opens_at: 6
              closes_at: 21

