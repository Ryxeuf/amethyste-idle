# Definition declarative des zones du World 1 (pivot PBBG, ZON-11).
#
# Source de verite unique du graphe de zones : les fixtures (ZoneGraphFixtures)
# ET la commande `app:zone:import` lisent ce fichier. Ajouter du contenu =
# ajouter de la donnee ici, pas du code.
#
# Format complet documente dans DOCUMENTATION.md, section « Configuration
# declarative de zone (ZON-11) ». Rappel des cles :
#   zones.<slug>:
#     name / name_en                identite (name_en -> nameTranslations.en)
#     description / description_en  texte (description_en -> descriptionTranslations.en)
#     type                          city | wilderness | interior | dungeon
#     safe                          true = aucune rencontre hostile
#     map_x / map_y                 position sur la carte du monde illustree (ZON-16), % 0-100 ; absent = zone hors carte
#     enabled                       (optionnel, defaut true)
#     source_map                    nom de la Map TMX d'origine (legacy, optionnel)
#     explore:                      table de rencontres / loot (optionnel -> defauts service)
#       weights: { mob, chest, harvest, pnj, nothing }
#       chest_gils_min / chest_gils_max
#     mobs:                         population de creatures (ZON-26b, optionnel)
#       - { monster, count, nocturnal, group_tag }
#       Seul chemin pour peupler une zone SANS carte d'origine : `Mob.zone`
#       etait sinon derive de `Mob.map` via `Zone::sourceMap`.
#     gather:                       filons recoltables partages (optionnel)
#       - { slug, item, profession, capacity, respawn_seconds, yield_min, yield_max }
#
#       CALIBRAGE DES FILONS — cf. docs/GAME_ZONE_ACTIONS.md §6.6
#       Ne pas poser de valeurs a la main : reprendre un profil de palier.
#       Le levier economique est le **debit soutenu** R = capacity x 3600 /
#       respawn_seconds (unites/heure). `capacity` n'est qu'un **tampon** : ce
#       qu'un afflux de joueurs absorbe avant que la vitalite touche son
#       plancher. Un tampon trop petit — c'etait le defaut de la calibration
#       d'origine — fait qu'un seul joueur vide le filon, et le joueur
#       occasionnel ne voit plus jamais la ressource.
#
#       | Palier          | capacity | respawn | rendement | R (u/h) | recolteurs |
#       |-----------------|---------:|--------:|-----------|--------:|-----------:|
#       | T0 fondation    |       72 |  45 min | 1-3       |      96 |         58 |
#       | T1 commun       |       60 |  45 min | 1-3       |      80 |         48 |
#       | T2 peu commun   |       32 |  60 min | 1-2       |      32 |         26 |
#       | T3 rare         |       24 |  90 min | 1-2       |      16 |         13 |
#       | T4 epique       |       22 | 180 min | 1-2       |     7.3 |          6 |
#
#       « recolteurs » = joueurs reguliers soutenus, a 20 recoltes/jour sur ce
#       filon (un joueur dispose de 80 recoltes/jour a 240 energie / 3).
#       T0 est reserve aux ressources qui gatent le plancher T1 de l'economie
#       (cuivre, etain, menthe, truite) : elles ne doivent jamais etre un goulot.
#       La rarete se regle par le **palier** et le **gate de competence**, pas en
#       etranglant la capacite.
#   connections:
#     - { from, to, travel_seconds, bidirectional, requires_discovery, enabled }

zones:
    # =========================================================================
    # ZONE 1 — Village de Lumiere (hub, zone sure)
    # =========================================================================
    #
    # Le point de depart de tout personnage, et le seul lieu ou l'on ne risque
    # rien. `safe: true` fait forcer le poids `mob` a 0 par `ExploreService` :
    # declarer une population ici n'aurait aucun effet, d'ou l'absence de bloc
    # `mobs:`.
    village-de-lumiere:
        name: 'Village de Lumière'
        name_en: 'Village of Light'
        description: "Le hub central du World 1. Un fanal dresse contre les tenebres alentour : la forge, les echoppes, les jardins du temple et les voyageurs de passage. Ici, rien ne mord."
        description_en: 'The central hub of World 1. A beacon raised against the surrounding dark: the forge, the shops, the temple gardens and passing travelers. Nothing bites here.'
        type: city
        safe: true
        map_x: 50
        map_y: 55
        enabled: true
        source_map: 'Village de Lumière'
        explore:
            # Ce qu'on trouve en flanant dans un village, ce sont des gens. Sans
            # bloc `explore`, la zone tombait sur les defauts du service (mob 50
            # ramene a 0, puis 40 % de « rien ») : flaner au village ne racontait
            # rien. Le poids `pnj` domine desormais, et `harvest` reste faible —
            # les jardins ci-dessous se recoltent directement, sans reperage.
            weights: { mob: 0, chest: 14, harvest: 10, pnj: 46, nothing: 30 }
            chest_gils_min: 3
            chest_gils_max: 12
            night:
                # Le village dort : les rues se vident, et la bourse oubliee sur
                # un etal a deja trouve preneur.
                weights: { mob: 0, chest: 8, harvest: 6, pnj: 22, nothing: 64 }
                chest_gils_min: 2
                chest_gils_max: 8
        gather:
            # Jardins du temple — palier T0 (cf. tableau en tete de fichier).
            #
            # Meme diagnostic que la camomille d'ECO-02 : le thym et la lavande
            # n'avaient **aucune source** dans le monde livre alors qu'ils gatent
            # les deux premieres recettes d'alchimie que rencontre un joueur —
            # `recipe-antidote` (niveau 2, 1x lavande) et `recipe-healing-medium`
            # (niveau 2, 2x thym), plus `recipe-elixir-defense` (niveau 3, 2x
            # thym). Les poser en zone sure au palier T0, c'est garantir que le
            # plancher T1 de l'economie ne dependra jamais d'une zone hostile.
            - { slug: carre-de-thym, item: plant-thyme, profession: herbalism, capacity: 72, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            - { slug: bordure-de-lavande, item: plant-lavender, profession: herbalism, capacity: 72, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
        pnjs:
            # Habitants declares (ZON-26b-b). Ils **completent** les sept PNJ de
            # `VillageHubPnjFixtures` (forgeron, alchimiste, marchand, maitresse
            # des quetes, banquier, garde, guide) : ceux-la portent des arbres de
            # dialogue et des chaines de quete, que le YAML ne sait pas decrire.
            # Ici, on ajoute des figures de fond — une replique, parfois un etal.
            - slug: village-jardiniere-fioline
              name: 'Fioline, jardiniere du temple'
              name_en: 'Fioline, Temple Gardener'
              class_type: villager
              greeting: "Le thym pousse le long du mur sud, la lavande sur la bordure. Sers-toi — mais laisse-en pour le suivant."
              # Plancher T1 PNJ (cf. docs/GAME_PRINCIPLES.md) : les herbes de base
              # restent achetables meme quand les carres sont a sec.
              shop_items: [plant-thyme, plant-lavender, plant-mint]
              opens_at: 7
              closes_at: 18
            - slug: village-crieur-hesper
              name: 'Hesper le crieur public'
              name_en: 'Hesper the Town Crier'
              class_type: villager
              greeting: "Avis ! La foret bruisse plus qu'a l'ordinaire, et les mines rendent moins de fer qu'au printemps. Voila pour les nouvelles."
            - slug: village-veilleur-tancrede
              name: 'Tancrede, veilleur de nuit'
              name_en: 'Tancred, Night Watchman'
              class_type: guard
              life: 60
              greeting: "Dors si tu peux. Moi, je compte les heures jusqu'a l'aube — et je vends de quoi les tenir."
              shop_items: [beer-pint, bread, grilled-meat]
              # Horaire a cheval sur minuit : `Pnj::isShopOpen` traite le cas
              # `opens_at > closes_at` comme une plage nocturne (20h -> 6h).
              opens_at: 20
              closes_at: 6

    # =========================================================================
    # ZONE 2 — Foret des murmures (premiere zone hostile)
    # =========================================================================
    #
    # La zone ou l'on apprend a se battre et a recolter. Population et habitants
    # sont **declares** ici : jusqu'a ZON-26b ils venaient de la carte TMX
    # d'origine via `MobFixtures`, ce qui melait deux sources de verite pour un
    # meme contenu.
    foret-des-murmures:
        name: 'Forêt des murmures'
        name_en: 'Whispering Forest'
        description: "Arbres centenaires, clairieres et riviere aux eaux vives. On y apprend a se battre et a cueillir — et, la nuit venue, a ne pas s'attarder."
        description_en: 'Ancient trees, clearings and a river of quick water. Here one learns to fight and to forage — and, once night falls, not to linger.'
        type: wilderness
        safe: false
        map_x: 28
        map_y: 38
        enabled: true
        source_map: 'Forêt des murmures'
        explore:
            weights: { mob: 45, chest: 12, harvest: 12, pnj: 8, nothing: 23 }
            chest_gils_min: 5
            chest_gils_max: 25
            # Variance jour/nuit (ZON-17) : la nuit, la foret devient plus hostile,
            # le butin des coffres plus genereux, et des morts-vivants nocturnes
            # (fantomes, squelettes) remplacent le vivier diurne quand ils sont presents.
            night:
                weights: { mob: 65, chest: 15, harvest: 5, pnj: 2, nothing: 13 }
                chest_gils_min: 10
                chest_gils_max: 40
                # Ce pool ne filtre que les creatures **presentes dans la zone**
                # (`ExploreService::resolveMob` retombe sur le vivier complet si le
                # filtre ne rend rien). Le squelette etait declare ici sans jamais
                # avoir ete peuple : le bloc `mobs:` ci-dessous le corrige.
                mob_slugs: [ghost, skeleton]
        gather:
            - { slug: herbes-de-la-foret, item: plant-mint, profession: herbalism, capacity: 72, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            - { slug: sauge-sauvage, item: plant-sage, profession: herbalism, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            - { slug: ginseng-des-sous-bois, item: plant-ginseng, profession: herbalism, capacity: 32, respawn_seconds: 3600, yield_min: 1, yield_max: 2 }
            - { slug: truites-de-riviere, item: fish-trout, profession: fishing, capacity: 72, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            # ECO-02 : la camomille n'avait aucune source dans le monde livre, ce
            # qui rendait `recipe_potion_base` — la premiere recette d'alchimie —
            # impossible a realiser.
            - { slug: camomille-des-clairieres, item: plant-chamomile, profession: herbalism, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            # Correctif 128b : ces herbes nourrissaient 8 recettes d'alchimie de
            # niveau 2 a 10 et n'etaient recoltables nulle part. Elles rejoignent
            # les zones de depart — les gater derriere l'Acte 4 aurait mis une
            # recette de niveau 2 hors de portee jusqu'au niveau 30.
            - { slug: aloes-des-clairieres, item: plant-aloe-vera, profession: herbalism, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            # Meme correctif, applique aux plantes restees orphelines : le romarin
            # alimente un enchantement, le pissenlit et l'echinacee ne poussaient
            # nulle part. La foret est leur biome naturel — et la premiere zone
            # ou un joueur ouvre l'arbre d'herboristerie.
            - { slug: romarin-des-lisieres, item: plant-rosemary, profession: herbalism, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            - { slug: pissenlits-des-clairieres, item: plant-dandelion, profession: herbalism, capacity: 72, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            - { slug: echinacee-des-fourres, item: plant-echinacea, profession: herbalism, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            # Le second poisson de la riviere, palier T2 : la truite nourrit le
            # plancher, le saumon donne une raison de revenir avec un meilleur
            # niveau de peche.
            - { slug: saumons-des-rapides, item: fish-salmon, profession: fishing, capacity: 32, respawn_seconds: 3600, yield_min: 1, yield_max: 2 }
        # Population declaree (ZON-26b). Elle remplace les spawns que
        # `MobFixtures` posait sur la carte TMX `map_3` : deux sources de verite
        # pour un meme contenu, dont une invisible depuis ce fichier.
        #
        # Le `count` est un **effectif**, pas une espece : quatre gelees sont
        # quatre rencontres possibles, et un combat en cours n'asseche pas la
        # zone pour les autres joueurs.
        mobs:
            # Vivier diurne — la marche de progression de la zone, du niveau 1
            # (gelee, loup, scarabee) au niveau 4 (loup alpha).
            - { monster: slime, count: 4 }
            - { monster: wolf, count: 4, group_tag: meute-des-murmures }
            - { monster: beetle, count: 3 }
            - { monster: spider, count: 3 }
            - { monster: venom_snake, count: 3 }
            - { monster: scorpion, count: 2 }
            - { monster: mushroom_golem, count: 2 }
            - { monster: ochu, count: 2 }
            - { monster: undine, count: 2 }
            - { monster: sylph, count: 2 }
            - { monster: salamander, count: 1 }
            - { monster: alpha_wolf, count: 1, group_tag: meute-des-murmures }
            # Vivier nocturne — c'est lui que `explore.night.mob_slugs` restreint.
            # Le squelette manquait : le pool nocturne le nommait sans qu'aucun
            # individu n'existe, et le filtre retombait silencieusement sur le
            # vivier diurne.
            - { monster: skeleton, count: 3, nocturnal: true }
            - { monster: ghost, count: 3, nocturnal: true }
            - { monster: will_o_wisp, count: 2, nocturnal: true }
            - { monster: creeping_shadow, count: 1, nocturnal: true }
            # Rencontre sommitale de la zone. Son pendant minier est le Seigneur
            # de la Forge ; toutes deux debloquent une entree de Codex au kill.
            - { monster: forest_guardian, count: 1 }
        pnjs:
            # Completent les cinq PNJ de `ForestPnjFixtures` (garde forestier,
            # herboriste, ermite, bucheron, chasseuse), qui portent les arbres de
            # dialogue de l'Acte 2 et restent donc en PHP.
            - slug: foret-pecheur-tobin
              name: 'Tobin, pecheur des rapides'
              name_en: 'Tobin, Rapids Fisherman'
              class_type: merchant
              greeting: "La truite mord toute l'annee. Le saumon, lui, se merite — remonte jusqu'aux rapides si tu veux le voir."
              shop_items: [fishing-rod-bronze, healing-potion-small, bread]
              opens_at: 5
              closes_at: 20
            - slug: foret-veilleuse-morrigane
              name: 'Morrigane, veilleuse des lisieres'
              name_en: 'Morrigane, Edge Watcher'
              class_type: hunter
              life: 45
              greeting: "Le jour, la foret n'est qu'une foret. Apres le crepuscule, ce qui marche entre les arbres n'a plus de souffle. Rentre."

    # =========================================================================
    # ZONE 3 — Mines profondes (extraction, palier au-dessus de la foret)
    # =========================================================================
    #
    # La zone d'extraction du monde de depart : c'est d'ici que sort la matiere
    # premiere de toute la chaine de forge. La recolte y prime sur la rencontre,
    # et le sous-sol ne connait pas le jour — mais les galeries desertees, si.
    mines-profondes:
        name: 'Mines profondes'
        name_en: 'Deep Mines'
        description: "Tunnels etayes, bassins noirs et filons a perte de galerie. On y descend pour le minerai ; ce qui remonte n'est pas toujours ce qu'on y a laisse."
        description_en: 'Propped tunnels, black pools and veins running the length of the gallery. One goes down for ore; what comes back up is not always what was left there.'
        type: wilderness
        safe: false
        map_x: 72
        map_y: 36
        enabled: true
        source_map: 'Mines profondes'
        explore:
            # Zone d'extraction : la recolte prime sur la rencontre, et les
            # coffres (caches de mineurs) sont plus genereux qu'en foret.
            weights: { mob: 38, chest: 18, harvest: 24, pnj: 4, nothing: 16 }
            chest_gils_min: 10
            chest_gils_max: 40
            night:
                # Les galeries desertees reveillent les constructs.
                weights: { mob: 58, chest: 20, harvest: 8, pnj: 1, nothing: 13 }
                chest_gils_min: 15
                chest_gils_max: 60
                mob_slugs: [clay_golem, rusty_automaton, stone_golem]
        gather:
            - { slug: filon-de-cuivre, item: ore-copper, profession: mining, capacity: 72, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            # ECO-02 : l'etain n'avait aucune source. Sans lui, pas de lingot de
            # bronze — donc aucun outil de bronze, et toute la chaine d'outillage
            # T1 restait hors d'atteinte.
            - { slug: filon-d-etain, item: ore-tin, profession: mining, capacity: 72, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            - { slug: filon-de-fer, item: ore-iron, profession: mining, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            - { slug: veine-d-or, item: ore-gold, profession: mining, capacity: 32, respawn_seconds: 3600, yield_min: 1, yield_max: 2 }
            # L'anguille electrique n'avait aucune source. Les bassins noyes des
            # galeries basses lui donnent son biome, et la mine sa premiere
            # ressource de peche — jusqu'ici l'extraction y etait le seul metier
            # de recolte represente. Palier T3 : on ne descend pas pecher par
            # hasard.
            - { slug: bassins-aux-anguilles, item: fish-electric-eel, profession: fishing, capacity: 24, respawn_seconds: 5400, yield_min: 1, yield_max: 2 }
        # Population declaree (ZON-26b), en remplacement des spawns de la carte
        # TMX `map_4`. La mine monte plus haut que la foret : on y croise du
        # niveau 1 pres du carreau et du niveau 24 au fond.
        mobs:
            # Carreau et premieres galeries.
            - { monster: bat, count: 4 }
            - { monster: giant_rat, count: 3 }
            - { monster: clay_golem, count: 3 }
            - { monster: stone_golem, count: 3 }
            # Galeries centrales — la patrouille d'automates est le premier
            # groupe organise que rencontre un joueur.
            # Une seule entree par espece : `ZoneImporter::syncMobs` complete
            # jusqu'au `count` declare en comptant les individus deja en base,
            # et deux entrees pour un meme monstre rendraient l'effectif final
            # dependant de l'ordre des flushs.
            - { monster: rusty_automaton, count: 4, group_tag: patrouille-de-la-mine }
            - { monster: gargoyle, count: 2 }
            - { monster: crystal_golem, count: 2 }
            # Salles profondes.
            - { monster: abyssal_blacksmith, count: 1 }
            # Vivier nocturne. `explore.night.mob_slugs` restreint les rencontres
            # aux constructs (golems et automates) : le chevalier maudit et la
            # liche restent des rencontres de fond, pas le theme de la nuit.
            - { monster: cursed_knight, count: 2, nocturnal: true }
            - { monster: lesser_lich, count: 1, nocturnal: true }
            # Rencontre sommitale de la zone, pendant du Gardien de la Foret.
            - { monster: forge_lord, count: 1 }
        pnjs:
            # Completent les cinq PNJ de `MinesPnjFixtures` (contremaitre,
            # ingenieure, marchand souterrain, guerisseuse, vieux prospecteur).
            # Sous terre, les horaires n'ont pas de sens : les etals miniers
            # ouvrent en continu (pas de `opens_at` / `closes_at`).
            - slug: mines-cantiniere-brida
              name: 'Brida, cantiniere du carreau'
              name_en: 'Brida, Pithead Cook'
              class_type: merchant
              greeting: "Descends le ventre plein ou ne descends pas. La galerie ne rend pas ce qu'elle prend."
              shop_items: [stew, grilled-meat, bread, beer-pint]
            - slug: mines-porteur-de-lanterne-kolm
              name: 'Kolm, porteur de lanterne'
              name_en: 'Kolm, Lantern Bearer'
              class_type: villager
              greeting: "Je marche devant, tu marches derriere. Si ma lampe s'eteint, ne cours pas : ecoute."

    marais-brumeux:
        name: 'Marais Brumeux'
        name_en: 'Misty Swamp'
        description: 'Brume epaisse et eaux stagnantes ; des creatures corrompues rodent.'
        description_en: 'Thick mist and stagnant waters; corrupted creatures lurk.'
        type: wilderness
        safe: false
        map_x: 32
        map_y: 74
        source_map: 'Marais Brumeux'
        explore:
            # Terrain hostile et pauvre en butin : on y vient pour ses plantes.
            weights: { mob: 48, chest: 8, harvest: 20, pnj: 4, nothing: 20 }
            chest_gils_min: 5
            chest_gils_max: 30
            night:
                # La brume nocturne appartient aux creatures corrompues.
                weights: { mob: 68, chest: 10, harvest: 6, pnj: 1, nothing: 15 }
                chest_gils_min: 10
                chest_gils_max: 45
                mob_slugs: [will_o_wisp, creeping_shadow, specter]
        gather:
            - { slug: ortie-des-marais, item: plant-nettle, profession: herbalism, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            - { slug: valeriane-des-tourbieres, item: plant-valerian, profession: herbalism, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            # Pire cas des quatre : une quete en demande deux exemplaires.
            - { slug: mandragore-des-tourbieres, item: plant-mandrake, profession: herbalism, capacity: 32, respawn_seconds: 3600, yield_min: 1, yield_max: 2 }
            - { slug: carpes-stagnantes, item: fish-carp, profession: fishing, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }
            - { slug: spores-fantomes, item: plant-ghostshroom, profession: herbalism, capacity: 24, respawn_seconds: 5400, yield_min: 1, yield_max: 2 }
            - { slug: belladone-des-tourbieres, item: plant-nightshade, profession: herbalism, capacity: 32, respawn_seconds: 3600, yield_min: 1, yield_max: 2 }

    crete-de-ventombre:
        name: 'Crête de Ventombre'
        name_en: 'Shadowind Ridge'
        description: 'Pics balayes par des vents violents ; le sommet abrite les creatures les plus rudes du World 1.'
        description_en: 'Peaks swept by violent winds; the summit shelters the toughest creatures of World 1.'
        type: wilderness
        safe: false
        map_x: 74
        map_y: 70
        source_map: 'Crête de Ventombre'
        explore:
            # Zone la plus rude du World 1 : peu de repit, mais les caches des
            # expeditions perdues y sont les mieux garnies.
            weights: { mob: 55, chest: 15, harvest: 12, pnj: 2, nothing: 16 }
            chest_gils_min: 15
            chest_gils_max: 55
            night:
                weights: { mob: 70, chest: 18, harvest: 4, pnj: 0, nothing: 8 }
                chest_gils_min: 25
                chest_gils_max: 80
                mob_slugs: [gargoyle, wyvern, griffin]
        gather:
            - { slug: filon-d-argent, item: ore-silver, profession: mining, capacity: 32, respawn_seconds: 3600, yield_min: 1, yield_max: 2 }
            - { slug: filon-de-cobalt, item: ore-cobalt, profession: mining, capacity: 32, respawn_seconds: 3600, yield_min: 1, yield_max: 2 }
            - { slug: givrecoiffe-des-cimes, item: plant-frostcap, profession: herbalism, capacity: 24, respawn_seconds: 5400, yield_min: 1, yield_max: 2 }

    quartier-des-jardins:
        name: 'Quartier des Jardins'
        name_en: 'Garden Quarter'
        description: "Le lotissement de Lumiere : allees de terre battue, murets bas et parcelles a vendre. On y bruit des projets plus que des combats."
        description_en: 'The residential quarter of Lumiere: dirt lanes, low walls and plots for sale. Plans are hatched here more often than fights.'
        type: city
        safe: true
        map_x: 42
        map_y: 46
        source_map: 'Village de Lumière'

    dunes-d-ambre:
        name: 'Dunes d''Ambre'
        name_en: 'Amber Dunes'
        description: "Une mer de sable ocre au sud du marais. Rien n'y pousse, tout y rampe — et la premiere zone du monde a n'avoir jamais eu de carte."
        description_en: 'A sea of ochre sand south of the marshes. Nothing grows there, everything crawls — and the first zone in the world that never had a map.'
        type: wilderness
        safe: false
        map_x: 30
        map_y: 78
        explore:
            weights: { mob: 50, chest: 12, harvest: 14, pnj: 2, nothing: 22 }
            chest_gils_min: 10
            chest_gils_max: 40
            night:
                weights: { mob: 62, chest: 14, harvest: 6, pnj: 0, nothing: 18 }
                mob_slugs: [scorpion, creeping_shadow]
        # ZON-26b : population declaree. Cette zone n'a **pas** de `source_map` —
        # c'est precisement ce que le chemin declaratif rend possible.
        mobs:
            - { monster: scorpion, count: 4 }
            - { monster: venom_snake, count: 3 }
            - { monster: salamander, count: 2 }
            - { monster: creeping_shadow, count: 2, nocturnal: true }
        # ZON-26b-b : habitants declares. Comme les creatures, ils sont rattaches
        # a la zone **directement** : sans ce chemin, une zone sans carte
        # d'origine ne pouvait avoir aucun PNJ, et le tirage `pnj: 2` de son
        # bloc `explore` ci-dessus ne menait a rien.
        pnjs:
            - slug: dunes-caravanier-yazid
              name: 'Yazid le caravanier'
              name_en: 'Yazid the Caravanner'
              class_type: merchant
              greeting: "Le sable avale tout, voyageur. Fais tes emplettes avant qu'il ne t'avale aussi."
              shop_items: [antidote, life-potion, healing-potion-small]
              opens_at: 6
              closes_at: 19
            - slug: dunes-guetteuse-tahira
              name: 'Tahira, guetteuse des dunes'
              name_en: 'Tahira, Dune Watcher'
              class_type: hunter
              life: 40
              greeting: 'Les scorpions sortent au crepuscule. Les ombres, elles, ne dorment jamais.'

        gather:
            - { slug: filon-de-cuivre-des-dunes, item: ore-copper, profession: mining, capacity: 60, respawn_seconds: 2700, yield_min: 1, yield_max: 3 }

# Liaisons du graphe. `bidirectional: true` cree les deux aretes (durees symetriques).
    # === Acte 4 (tache 128b) ===
    #
    # Deux bras longs partant du monde connu, l'un au sud vers le sel, l'autre
    # au nord vers la glace. Ils ne se rejoignent pas : le desert et la toundra
    # doivent rester loin l'un de l'autre, sinon leurs deux facons de tuer
    # (l'usure et le gel, cf. 128a) se melangent en une seule.

    mer-de-sel:
        name: 'Mer de Sel'
        name_en: 'Salt Sea'
        description: "Une croute blanche a perte de vue, craquelee par la chaleur. Ce qui bouge ici a appris a ne plus avoir soif."
        description_en: 'A white crust as far as the eye can see, cracked by the heat. What moves here has learned to stop being thirsty.'
        type: wilderness
        safe: false
        map_x: 24
        map_y: 88
        explore:
            weights: { mob: 55, chest: 14, harvest: 10, pnj: 3, nothing: 18 }
            chest_gils_min: 25
            chest_gils_max: 90
            night:
                weights: { mob: 66, chest: 16, harvest: 4, pnj: 0, nothing: 14 }
                mob_slugs: [dune_wraith, basilisk]
        mobs:
            - { monster: sand_stalker, count: 4 }
            - { monster: salt_colossus, count: 3 }
            - { monster: basilisk, count: 2 }
            - { monster: dune_wraith, count: 2, nocturnal: true }
        gather:
            - { slug: gemme-de-sel, item: ore-ruby, profession: mining, capacity: 32, respawn_seconds: 3600, yield_min: 1, yield_max: 2 }

    cite-ensevelie:
        name: 'Cite Ensevelie'
        name_en: 'Buried City'
        description: "Des toits qui affleurent le sable. On ne sait pas qui vivait la, et ce qui l'occupe aujourd'hui ne le dira pas."
        description_en: 'Rooftops breaking the surface of the sand. Nobody knows who lived here, and what occupies it today will not say.'
        type: wilderness
        safe: false
        map_x: 18
        map_y: 96
        explore:
            weights: { mob: 58, chest: 18, harvest: 8, pnj: 2, nothing: 14 }
            chest_gils_min: 40
            chest_gils_max: 140
            night:
                weights: { mob: 70, chest: 20, harvest: 2, pnj: 0, nothing: 8 }
                mob_slugs: [dune_wraith, basilisk]
        mobs:
            - { monster: dune_wraith, count: 5 }
            - { monster: basilisk, count: 3 }
            - { monster: sand_stalker, count: 3, group_tag: pillards }
        gather:
            - { slug: fruit-du-vide, item: plant-voidfruit, profession: herbalism, capacity: 24, respawn_seconds: 5400, yield_min: 1, yield_max: 2 }
            - { slug: eclat-de-diamant, item: ore-diamond, profession: mining, capacity: 24, respawn_seconds: 5400, yield_min: 1, yield_max: 2 }

    pas-de-givre:
        name: 'Pas de Givre'
        name_en: 'Frostgate Pass'
        description: "Le col au-dela de la crete. Le vent y porte des choses qui hurlent, et le froid ne laisse pas s'arreter."
        description_en: 'The pass beyond the ridge. The wind carries things that howl, and the cold does not let you stop.'
        type: wilderness
        safe: false
        map_x: 74
        map_y: 14
        explore:
            weights: { mob: 56, chest: 14, harvest: 12, pnj: 2, nothing: 16 }
            chest_gils_min: 25
            chest_gils_max: 90
            night:
                weights: { mob: 68, chest: 16, harvest: 4, pnj: 0, nothing: 12 }
                mob_slugs: [hoarfrost_shade, frost_warg]
        mobs:
            - { monster: frost_warg, count: 5, group_tag: meute }
            - { monster: winter_harpy, count: 3 }
            - { monster: hoarfrost_shade, count: 2, nocturnal: true }
        gather:
            - { slug: fleur-de-lune-des-neiges, item: plant-moonflower, profession: herbalism, capacity: 24, respawn_seconds: 5400, yield_min: 1, yield_max: 2 }
            - { slug: filon-d-emeraude, item: ore-emerald, profession: mining, capacity: 24, respawn_seconds: 5400, yield_min: 1, yield_max: 2 }

    glacier-du-silence:
        name: 'Glacier du Silence'
        name_en: 'Glacier of Silence'
        description: "Rien n'y pousse, rien n'y crie. Ce qu'on entend sous la glace n'a pas de nom, et il vaut mieux ne pas s'arreter pour ecouter."
        description_en: 'Nothing grows, nothing cries out. What is heard beneath the ice has no name, and it is better not to stop and listen.'
        type: wilderness
        safe: false
        map_x: 80
        map_y: 6
        explore:
            weights: { mob: 62, chest: 18, harvest: 6, pnj: 0, nothing: 14 }
            chest_gils_min: 40
            chest_gils_max: 150
            night:
                weights: { mob: 74, chest: 20, harvest: 2, pnj: 0, nothing: 4 }
                mob_slugs: [rime_drake, hoarfrost_shade]
        mobs:
            - { monster: permafrost_golem, count: 3 }
            - { monster: hoarfrost_shade, count: 3 }
            - { monster: rime_drake, count: 2 }
            - { monster: winter_harpy, count: 2, nocturnal: true }
        gather:
            - { slug: feuille-de-dragon-gelee, item: plant-dragonleaf, profession: herbalism, capacity: 24, respawn_seconds: 5400, yield_min: 1, yield_max: 2 }
            - { slug: fleur-de-phenix, item: plant-phoenixflower, profession: herbalism, capacity: 22, respawn_seconds: 10800, yield_min: 1, yield_max: 2 }

connections:
    - { from: village-de-lumiere, to: quartier-des-jardins, travel_seconds: 60, bidirectional: true }
    - { from: village-de-lumiere, to: foret-des-murmures, travel_seconds: 300, bidirectional: true }
    - { from: village-de-lumiere, to: marais-brumeux, travel_seconds: 420, bidirectional: true }
    - { from: village-de-lumiere, to: mines-profondes, travel_seconds: 600, bidirectional: true }
    - { from: village-de-lumiere, to: crete-de-ventombre, travel_seconds: 900, bidirectional: true }
    - { from: foret-des-murmures, to: marais-brumeux, travel_seconds: 300, bidirectional: true }
    - { from: marais-brumeux, to: dunes-d-ambre, travel_seconds: 480, bidirectional: true }
    - { from: mines-profondes, to: crete-de-ventombre, travel_seconds: 480, bidirectional: true }
    # ZON-26 : fermeture de l'anneau. Le graphe etait une etoile autour du hub
    # avec deux liaisons laterales ; passer par la peripherie devient une
    # alternative credible au detour par le village, ce qui donne enfin du sens
    # au choix d'itineraire (et a la reduction de temps de voyage des montures).
    - { from: foret-des-murmures, to: mines-profondes, travel_seconds: 480, bidirectional: true }
    - { from: marais-brumeux, to: crete-de-ventombre, travel_seconds: 540, bidirectional: true }

    # Acte 4 (tache 128b) : deux bras longs. Les durees disent l'eloignement —
    # on ne va pas au bout du monde entre deux actions.
    - { from: dunes-d-ambre, to: mer-de-sel, travel_seconds: 720, bidirectional: true }
    - { from: mer-de-sel, to: cite-ensevelie, travel_seconds: 600, bidirectional: true }
    - { from: crete-de-ventombre, to: pas-de-givre, travel_seconds: 780, bidirectional: true }
    - { from: pas-de-givre, to: glacier-du-silence, travel_seconds: 660, bidirectional: true }
