# =============================================================================
# Foyers — seuils, decroissance, seed du monde livre (FOY-01)
# =============================================================================
# Chiffrage complet et sa justification : docs/BALANCE.md § 23.
#
# Regle du fichier (PLAN_SETTLEMENTS, « Rien en dur ») : seuils de rang, taux de
# decroissance, quotas de Crue et couts de restauration sont des **parametres**,
# jamais des constantes de classe. Le calibrage se fait sans redeploiement.
#
# Tout est calibre a **W = 1** (~50 joueurs actifs quotidiens). Le facteur de
# monde (FOY-17b) met les **seuils** a l'echelle, jamais les **taux** : c'est ce
# qui garde constant le *temps* de montee d'un foyer quand la population change.
# =============================================================================

# Somme des quatre indices requise pour tenir un rang (BALANCE § 23.3).
# Repere d'echeancier : 12 joueurs focalises (480 grains/j) atteignent le Bourg
# en ~24 jours — le premier marche du serveur est l'evenement de la premiere
# maree, et c'est l'ancre de tout le chiffrage.
ranks:
    camp: 150         # Campement — 3 grains/j : deux joueurs, ou du simple transit
    hamlet: 1200      # Hameau    — 24 grains/j : un regulier dedie suffit
    town: 8000        # Bourg     — 160 grains/j : **exige une guilde** (Acte III)
    city: 25000       # Cite      — 500 grains/j : n'existe qu'avec la croissance
    metropolis: 60000 # Metropole — 1200 grains/j : le projet d'un serveur qui a reussi

# Decroissance quotidienne de chaque indice (BALANCE § 23.2).
# Demi-vie ~35 jours, un peu plus d'une maree : un foyer delaisse une maree
# entiere descend visiblement, un foyer delaisse une semaine ne s'effondre pas.
# Consequence structurante : le stock d'equilibre vaut 50 x le flux quotidien —
# le rang est donc, a terme, une photographie de la frequentation reelle.
decay:
    daily_rate: 0.02

# Le type s'installe quand l'indice dominant depasse le second de cette marge,
# **tenue une maree entiere** (BALANCE § 23.4). Sans hysteresis, le type
# clignote et la ville n'a pas d'identite.
# En dessous du rang Hameau, pas de type : un Campement n'a pas encore d'identite.
type:
    dominance_margin: 0.25
    sustain_days: 28
    minimum_rank: hamlet

# Regression et reascension (BALANCE § 23.6, FOY-10).
#
# `grace_days` : une maree entiere pour redresser avant de perdre le rang. Le
# message est « ce lieu s'endort », jamais « vous avez perdu » — et jamais une
# retrogradation surprise.
#
# `max_ranks_per_tide` : un seul rang perdu a la fois. Recalculer le rang naturel
# ferait chuter un foyer de trois crans d'un coup, et une ville qui s'effondre en
# une nuit n'apprend rien a personne.
#
# `rebuild_multiplier` : tant que le foyer est sous son plus haut rang, les
# depots comptent double. Rebatir est deux fois plus rapide que batir — le
# patrimoine, c'est de la memoire, pas des murs.
regression:
    grace_days: 28
    max_ranks_per_tide: 1
    rebuild_multiplier: 2

# Grains deposes par action (BALANCE § 23.1). Aucun evenement domaine nouveau :
# `InfluenceListener` ecoute deja exactement ces six-la, on branche un second
# consommateur.
sediment:
    mob_kill: { index: war, grains: 1 }
    harvest: { index: trade, grains: 1 }
    fishing: { index: trade, grains: 1 }
    butchering: { index: trade, grains: 1 }
    craft: { index: trade, grains: 1 }
    quest: { index: lore, grains: 5 }
    # Traverser une zone y depose une trace faible mais reelle. C'est ce qui
    # fait vivre une zone de transit sans qu'on y farme (GAME_WORLD § 5.5,
    # levier 4) : 20 traversees/jour tiennent un Campement.
    travel: { index: spread, grains: 0.2 }
    # Livraison d'une commission hebdomadaire (RET-02b). Reparti sur les quatre
    # indices : ce qu'un joueur rapporte profite a la ville entiere, et une
    # commission solo ne decide donc jamais a elle seule de son identite.
    #
    # `capped: false` — une commission est structurellement ingrindable (une par
    # semaine, sans reroll). La soumettre au plafond journalier mangerait en
    # silence le rendez-vous d'un joueur qui a beaucoup joue le meme jour, ce qui
    # punirait exactement le comportement qu'on cherche a obtenir.
    commission: { index: spread, grains: 24, capped: false }
    # Cloture d'un chantier de la semaine (RET-05). Reparti sur les quatre
    # indices, et hors plafond pour la meme raison que la commission : un
    # chantier collectif se remplit une fois par semaine et n'est pas grindable.
    settlement_work: { index: spread, grains: 120, capped: false }

# Plafonds anti-exploit, appliques via `InfluenceAntiExploit` — on ne reecrit
# pas les garde-fous, on s'y branche. Le grind ne bat jamais la regularite.
anti_exploit:
    daily_cap_per_player: 60
    diminishing_threshold: 40
    # Au-dela du seuil, chaque grain ne compte plus que pour moitie. Plus doux
    # que le 0,1 de l'influence de guilde, et voulu : un foyer se batit en
    # frequentant, pas en optimisant. Le joueur qui depasse 40 n'est pas puni,
    # il cesse simplement de distancer celui qui joue tous les jours.
    diminishing_factor: 0.5

# Services ouverts par le rang du foyer (FOY-05).
#
# **Decision A — rien n'est retro-gate.** Cette table ne contient que des
# services *nouveaux*, qui n'existaient pas avant le pilier. Un service deja
# pose dans le monde livre (un PNJ, une boutique, un etabli) n'a rien a faire
# ici : il resterait ouvert de toute facon, et l'y ecrire laisserait croire
# qu'un jour il pourrait fermer. `never_gated` ci-dessous rend ce refus
# executable — le chargeur rejette toute intersection entre les deux listes.
#
# Un service **absent** de cette table est ouvert partout. C'est le defaut, et
# c'est voulu : gater se declare, s'ouvrir ne se declare pas.
services:
    regional_market: { minimum_rank: town }      # Bourg — le 1er marche du serveur
    zone_bank: { minimum_rank: city }
    rented_stall: { minimum_rank: city }
    # Metropole — l'Autel d'eveil est un service *de la ville*, ouvert a tous et
    # taxe par la guilde controlante ; il ne ferme jamais une fois ouvert et ne
    # gate ni l'obtention ni l'usage d'une materia (GAME_WORLD § 12.3, § 2.1).
    awakening_altar: { minimum_rank: metropolis }

# Services que le rang ne fermera jamais, et pourquoi. Les inscrire ici n'est
# pas de la documentation : le chargeur refuse qu'ils apparaissent dans
# `services`, ce qui rend la decision A impossible a contredire par megarde.
never_gated:
    # FOY-06, arbitrage : `group_dungeon` figurait dans `services` au rang Cite.
    # Or les donjons de groupe sont livres depuis ZON-19/20, et aucun foyer du
    # seed n'atteint la Cite : le gate les aurait tous fermes le jour de sa mise
    # en service. C'est exactement ce que la decision A interdit, et le premier
    # jalon qui *applique* le gate est aussi celui qui le decouvre.
    group_dungeon: 'donjons de groupe livres par ZON-19/20 — aucun foyer du monde livre n''atteint la Cite, les gater les fermerait tous'
    pnj: 'habitants deja poses dans le monde livre — une ville ne perd pas ses gens en maigrissant'
    shop: 'boutiques existantes ; le plancher T1 anti cold-start en depend (ECO-02)'
    workshop: 'etablis deja poses — fermer un metier retirerait une progression acquise'
    gathering: 'les filons appartiennent a la zone, pas au foyer'
    travel: 'fermer un voyage enfermerait un joueur dans une zone qui decline'

# Bonus d'atelier (FOY-07). Conception : GAME_WORLD § 5.2.
#
# « Une ville est bonne a quelque chose de precis. » Le bonus se lit sur trois
# choses, et **jamais sur le joueur** : le rang du foyer, son type, et la ligne
# de production de la zone (§ 5.1). Consequence recherchee : on voyage pour
# crafter, et une guilde qui fait monter un foyer choisit litteralement le
# metier de sa region.
#
# L'unite est le **point de chance de qualite superieure**, la meme que le bonus
# de specialisation de metier auquel il s'additionne. Deux unites differentes se
# seraient melangees tot ou tard, et rien ne l'aurait signale.
workshop:
    # Ce que le rang seul accorde, sur tous les metiers : un etabli de Metropole
    # vaut mieux qu'un etabli de Hameau, quoi qu'on y forge. En dessous du
    # Hameau, rien — un Campement n'a pas encore d'atelier a offrir.
    rank_bonus:
        hamlet: 1
        town: 2
        city: 3
        metropolis: 4

    # Ce que le **type** accorde, au metier qu'il sert. Le type ne se choisit
    # pas : il se deduit de l'indice dominant (FOY-03). C'est donc la
    # frequentation qui decide du metier favorise, pas une decision de guilde.
    type_bonus:
        trading: { tanneur: 3 }      # Comptoir  — cuirs et marchandises
        bastion: { forgeron: 3 }     # Bastion   — on y forge des armes
        athenaeum: { alchimiste: 3 } # Athenee   — le savoir, donc la transmutation
        sanctuary: { joaillier: 3 }  # Sanctuaire — sertissage et materia

    # Ce que la **ligne de production** de la zone accorde (§ 5.1) : une epee se
    # forge mieux la ou le metal sort. Une ligne sans metier en face n'est pas
    # une omission — le bois et l'amethyste attendent leurs metiers (ECO-29→31
    # pour le charpentier et le tailleur ; la prospection n'a pas d'etabli).
    line_bonus:
        metal: { forgeron: 3 }
        leather: { tanneur: 3 }
        stone: { joaillier: 3 }
        water: { alchimiste: 3 }
        wood: {}
        amethyst: {}

    # Plafond du cumul. Ce n'est pas un detail de calibrage : sans lui, une
    # Metropole batie sur sa propre ligne accorderait 10 points, soit davantage
    # que la specialisation de metier — un choix irreversible paye en experience
    # de domaine. Un lieu ne doit pas valoir plus qu'une carriere.
    cap: 8

    # Ligne de production de chaque zone (§ 5.1). Une zone absente n'apporte que
    # son rang : le refuser bloquerait la livraison d'une zone neuve pour une
    # raison de calibrage.
    zone_line:
        foret-des-murmures: wood
        mines-profondes: metal
        marais-brumeux: water
        crete-de-ventombre: stone
        dunes-d-ambre: leather

# Chantier de la semaine (RET-05). A la maniere de la Restauration d'Ishgard :
# la maree dit **ou va** la ville, le chantier dit **ce qu'elle attend cette
# semaine**. C'est ce qui donne une voix au foyer — jusqu'ici il encaissait le
# sediment en silence, sans rien demander a personne.
weekly_work:
    # Ce que chaque **type** de foyer demande. Le type se deduit de l'indice
    # dominant (FOY-03) : c'est donc la frequentation passee qui decide de ce que
    # la ville reclame, et personne ne le choisit.
    #
    # `none` couvre les foyers sous le Hameau, qui n'ont pas encore d'identite :
    # ils demandent le minimum vital. Les omettre les aurait laisses sans
    # chantier, c'est-a-dire sans le seul rendez-vous collectif qu'un Campement
    # puisse offrir.
    demands:
        trading: [harvest, craft]      # Comptoir  — de la matiere et de l'ouvrage
        bastion: [mob_kill]            # Bastion   — qu'on tienne les abords
        athenaeum: [quest]             # Athenee   — qu'on regle les affaires
        sanctuary: [craft, quest]      # Sanctuaire — de l'ouvrage et du service
        none: [harvest]

    # Cible de base par activite, avant mise a l'echelle par le rang.
    targets:
        harvest: 200
        craft: 40
        mob_kill: 150
        quest: 15
        fishing: 60
        butchering: 60

    # Une grande ville demande davantage. Le multiplicateur porte sur la
    # **cible**, jamais sur la recompense : un chantier de Metropole est plus
    # long, il ne rapporte pas proportionnellement plus a chacun.
    rank_multipliers:
        ruin: 1
        camp: 1
        hamlet: 1
        town: 2
        city: 3
        metropolis: 4


# Seed du monde livre (decision A — **rien n'est retro-gate**, BALANCE § 23.5).
# Le seed est narratif, pas protecteur : si personne ne frequente les Mines,
# leur foyer redescendra. Mais les services *existants* ne ferment jamais
# (garde-fou FOY-05) — la decroissance ne retire que ce que les joueurs ont bati.
seed:
    foret-des-murmures: { rank: hamlet, stock: 2000 }
    mines-profondes: { rank: hamlet, stock: 2000 }
    marais-brumeux: { rank: camp, stock: 400 }
    crete-de-ventombre: { rank: camp, stock: 400 }
    dunes-d-ambre: { rank: camp, stock: 300 }
    # Les Vallons (ZON-30) demarreront en Ruine : zone neuve, tout est a batir.
    # C'est le premier chantier collectif offert aux joueurs.

# Zones sans foyer, et pourquoi. Une zone absente de `seed` mais absente d'ici
# serait une omission ; l'ecrire est ce qui distingue les deux.
without_settlement:
    village-de-lumiere: 'batie sur la Voute — rien ne s''y depose (GAME_WORLD § 3.4)'
    quartier-des-jardins: 'meme Voute que Lumiere'
    cite-ensevelie: 'donjon, pas foyer : on la fouille, elle ne monte pas (GAME_ZONES § 2.8)'
    mer-de-sel: 'le Silence / Extension 1 (GAME_WORLD § 4.3)'
    pas-de-givre: 'Extension 1'
    glacier-du-silence: 'Extension 1'
