# =============================================================================
# Les fourches des arbres de combat (ARC-14a)
# =============================================================================
# GAME_ARCHETYPES § 6.1 bis. **Deux pyromanciens finis etaient identiques.**
# Le palier 3 d'un arbre ecrit deux branches — deux passifs et un accord
# chacune — et une seule s'apprend : *l'arbre ecrit 18 nœuds et 60 pb, le
# personnage en apprend 15 et en porte 50.*
#
# C'est cette regle, et elle seule, qui reconcilie les deux nombres du canon :
# sans fourche, un arbre au gabarit couterait 540 points et non 390. Ce fichier
# est donc un **prerequis d'ARC-07**, et non sa suite — la dependance que le
# graphe du plan avait dans l'autre sens.
#
# **Chaque branche ouvre son geste**, et c'est ce qui decide si la fourche est
# un choix ou une decoration : mesure au § 9 bis, deux branches qui ne
# different que par leurs passifs produisent **le meme combat, au tour pres**
# (11 tours contre 11). Avec un accord par branche, elles se separent de deux
# tours et de deux facons de jouer.
#
# **Deux branches, jamais trois** — meme regle que les metiers
# (`craft_branches.yaml`, DOM-04) : le choix doit se raconter en une phrase.
#
# Hors perimetre, assume : les **20 autres arbres** n'ont pas de fourche ici.
# Le canon n'en nomme que quatre (§ 9.1 → 9.4), et inventer les vingt autres
# serait ecrire du contenu sans l'avoir instruit — c'est le travail d'ARC-08,
# et `CombatBranchCatalogTest` en tient la liste nommee, en cliquet.
# =============================================================================

trees:
    # --- Pyromancien — feu x sorts x assaut (§ 9.1) ----------------------
    # *La Braise* tient le feu qui **dure**, *l'Eclat* le feu qui **passe**.
    # La teinte `grip` ne vit que dans la Braise : c'est ce qui fait que les
    # deux branches ne sont pas deux dosages du meme arbre.
    pyromancy:
        label: 'Pyromancien'
        branches:
            ember:
                label: 'La Braise'
                description: 'Le feu qui dure : des brulures plus tenaces, et un critique qui fait mal quand il tombe.'
                accord: 'Brasier'
            flare:
                label: 'L''Éclat'
                description: 'Le feu qui passe : il ronge la resistance et frappe le premier.'
                accord: 'Nova de feu'

    # --- Guerisseur — eau x sorts x entretien (§ 9.2) --------------------
    # La fourche qui oppose **deux contextes** plutot que deux dosages : le
    # Ressac repond seul, la Maree provisionne pour quatre.
    healer:
        label: 'Guérisseur'
        branches:
            undertow:
                label: 'Le Ressac'
                description: 'La reponse solitaire : retirer un statut, tenir seul ce qui tombe maintenant.'
                accord: 'Dissipation'
            tide:
                label: 'La Marée'
                description: 'La provision : un depot qui couvre une rencontre entiere, meme deconnecte.'
                accord: 'Grande Marée'

    # --- Soldat — metal x melee x encaisse (§ 9.3) -----------------------
    # *La plus parlante des quatre* : le Mur encaisse et donne, la Ligne
    # mobile finit les combats seule.
    soldier:
        label: 'Soldat'
        branches:
            wall:
                label: 'Le Mur'
                description: 'Ce qu''on vient chercher en donjon : encaisser pour quatre, et le deposer.'
                accord: 'Rempart'
            skirmish:
                label: 'La Ligne mobile'
                description: 'De quoi finir un combat seul : esquiver, et frapper fort une fois.'
                accord: 'Charge d''acier'

    # --- Archer — air x distance x assaut (§ 9.4) ------------------------
    # La seule fourche ou la teinte porte sur la **ressource** : `wind`
    # recupere la munition, et la Volee en depense quatre d'un coup.
    archer:
        label: 'Archer'
        branches:
            watch:
                label: 'Le Guet'
                description: 'Le gros coup prepare : viser, attendre, et ne pas manquer.'
                accord: 'Tir du faucon'
            volley:
                label: 'La Volée'
                description: 'Quatre munitions d''un coup, dont la moitie revient.'
                accord: 'Grêle'

    # --- Necromancien — tenebres x sorts x controle (ARC-08a) ------------
    # La cinquieme fourche, et la premiere hors des quatre patrons. Elle
    # oppose **le solo au donjon** plutot que deux dosages : le Linceul tient
    # l'ennemi et le tient seul, la Veillee tient la duree et sert le groupe.
    # C'est la forme forte de la regle 6 (§ 12.3).
    necromancer:
        label: 'Nécromancien'
        branches:
            shroud:
                label: 'Le Linceul'
                description: 'Rien ne me touche parce que rien ne joue : percer les resistances, jouer le premier, etouffer.'
                accord: 'Linceul'
            vigil:
                label: 'La Veillée'
                description: 'Ce qu''on pose continue sans soi : ce qu''on prend revient, et ce qu''on laisse frappe encore.'
                accord: 'Serviteur d''ossements'

    # --- Assassin — tenebres x melee x assaut (ARC-08b) -------------------
    # Le premier arbre d'**assaut en melee**, et la case que les quatre
    # patrons laissaient vide : ARC-07 a livre l'assaut en sorts et au tir,
    # jamais au contact. C'est aussi l'arbre que GAME_TREE_ANATOMY deroule
    # comme methode (§ 4), donc celui dont chaque nœud est deja ecrit.
    #
    # La fourche n'oppose pas deux dosages du critique : elle oppose **la
    # facon de ne pas etre touche** a **la facon de trancher**. L'Ombre evite
    # et rejoue ; la Lame ignore l'armure et frappe une fois pour toutes.
    # Aucun levier commun — {dodge, tempo} contre {critical_power, pierce}.
    assassin:
        label: 'Assassin'
        branches:
            shadow:
                label: 'L''Ombre'
                description: 'Ce qui ne se laisse pas toucher frappe deux fois : esquiver en cuir, rejouer a deux lames.'
                accord: 'Danse des ombres'
            blade:
                label: 'La Lame'
                description: 'Une seule ouverture suffit : ignorer ce qui protege, et faire payer le critique.'
                accord: 'Coup mortel'

    # --- Artificier — feu x distance x controle (ARC-08c) -----------------
    # La seule tension d'archetype du jeu (§ 13.4) : **sa fonction allonge les
    # combats, et sa ressource se vide avec leur longueur**. La fourche est
    # donc une reponse a cette tension, et pas un dosage — *finir vite* contre
    # *pouvoir durer*.
    #
    # C'est aussi ce qui fait de `wind` une **reparation** plutot qu'un
    # assaisonnement : la teinte rend de la munition, c'est-a-dire exactement
    # ce que la fonction consomme.
    artificer:
        label: 'Artificier'
        branches:
            short_fuse:
                label: 'Mèche courte'
                description: 'Ce qui brule doit bruler maintenant : tenir la marque, jouer le premier, tout depenser d''un coup.'
                accord: 'Barrage d''artillerie'
            reserve:
                label: 'Réserve'
                description: 'Durer plus longtemps que la ligne d''en face : recuperer la munition, percer plutot que bruler.'
                accord: 'Tir couvrant'

    # --- Gardien — terre x melee x entretien (ARC-08d) --------------------
    # Le canon l'ecrit **en paire avec le Defenseur**, sur la meme case
    # d'element et de registre : *seule leur fonction differe*. C'est la
    # demonstration du troisieme axe sans qu'un seul chiffre ait a la faire.
    #
    # La fourche oppose **rendre** a **resister**, et depuis l'arbitrage de
    # l'ecart n° 13 le Rempart echange `thrift` contre `wind` : la reprise
    # **raccourcie** contre la reprise **sautee**, deux facons de payer le meme
    # cout de registre.
    guardian:
        label: 'Gardien'
        branches:
            source:
                label: 'La Source'
                description: 'Ce qu''on pose continue sans nous : rendre a chaque tour, et porter assez pour en donner.'
                accord: 'Sève de pierre'
            rampart:
                label: 'Le Rempart'
                description: 'Rien n''accroche et rien ne coute : resister aux entraves, et sauter la reprise.'
                accord: 'Rempart de pierre'

    # --- Vagabond — air x melee x controle (ARC-08e) ----------------------
    # **La derniere case atteignable de la grille.** Les 24 arbres de combat
    # n'occupent que 9 des 12 cases fonction x registre : il n'existe aucun
    # arbre d'encaisse a distance, aucun d'encaisse en sorts, aucun
    # d'entretien au tir. Avec celui-ci, le simulateur les joue toutes.
    #
    # La fourche oppose **passer devant** a **casser l'elan** : le Sillage
    # arrive avant la question et ramasse les siens en passant, le Contre
    # attend et retire l'appui.
    wanderer:
        label: 'Vagabond'
        branches:
            wake:
                label: 'Le Sillage'
                description: 'Arriver avant que la question ne se pose, et ne laisser personne derriere.'
                accord: 'Brise apaisante'
            counter:
                label: 'Le Contre'
                description: 'Attendre le pas de trop : passer entre les gardes, et durer plus que l''autre.'
                accord: 'Courant d''air'
