# =============================================================================
# Release Pipeline — Semantic Release + Docker Push + Deploiement
# =============================================================================
#
# Declenchee :
#   - par un push direct sur `main` ;
#   - par `auto-merge.yml`, qui appelle explicitement ce workflow apres avoir
#     fusionne une PR (le squash-merge fait au GITHUB_TOKEN n'emet aucun
#     evenement `push` — voir l'en-tete de auto-merge.yml) ;
#   - a la main, depuis l'onglet Actions.
#
# Etapes :
#   1. CI complete (lint, phpstan, tests, e2e, build Docker de validation)
#   2. Semantic Release (analyse des commits, creation tag + GitHub Release)
#   3. Build et push de l'image Docker vers GHCR (tags: latest, vX.Y.Z, sha)
#   4. Deploiement en production (appel de deploy.yml)
#
# Le deploiement est appele DIRECTEMENT ici, et non via l'evenement
# `release: published` : la release etant creee par le GITHUB_TOKEN, cet
# evenement ne declenche aucun workflow. C'est pourquoi, sur les 30 derniers
# deploiements du depot, aucun n'etait automatique.
# =============================================================================

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. CI — Validation complete
  # ---------------------------------------------------------------------------
  ci:
    name: "CI"
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  # ---------------------------------------------------------------------------
  # 2. Semantic Release — Tag + GitHub Release + Release Notes
  # ---------------------------------------------------------------------------
  release:
    name: "Semantic Release"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          if [ "${{ steps.semantic.outputs.new_release_published }}" = "true" ]; then
            echo "### 🏷️ Release v${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY
            echo "Type: ${{ steps.semantic.outputs.new_release_type }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "L'image va etre poussee vers GHCR, puis deployee en production." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Pas de nouvelle release" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Aucun commit de type \`feat\`, \`fix\`, \`perf\` ou \`refactor\` depuis la derniere version." >> $GITHUB_STEP_SUMMARY
            echo "**Aucun deploiement ne sera declenche** : c'est le comportement attendu pour" >> $GITHUB_STEP_SUMMARY
            echo "une livraison qui ne change pas le produit (\`docs\`, \`ci\`, \`test\`, \`chore\`, \`style\`)." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Dernier commit analyse :" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            git log -1 --pretty=%s >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # 3. Docker Build + Push — Uniquement si nouvelle release
  # ---------------------------------------------------------------------------
  docker-push:
    name: "Docker Push"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_prod
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:v${{ needs.release.outputs.new_release_version }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_ENV=prod
            APP_VERSION=${{ needs.release.outputs.new_release_version }}

      - name: Push summary
        run: |
          echo "### Docker image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAME }}:v${{ needs.release.outputs.new_release_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # 3 bis. L'image de developpement — pour les sessions Claude Code
  # ---------------------------------------------------------------------------
  # **Elle suit `main`, pas la derniere version, et c'est voulu.** Une session
  # veut la stack du moment pour lancer les tests du code qu'elle est en train
  # d'ecrire ; lui servir le dernier tag publie lui donnerait un environnement
  # en retard sur la branche qu'elle modifie.
  #
  # Ce job n'est donc **pas** derriere `new_release_published` : la publier avec
  # les versions liait un outil de developpement au rythme des livraisons, si
  # bien qu'une fusion de type `ci:` ou `docs:` — qui ne declenche aucune
  # release par construction (`.releaserc.json`) — laissait l'outillage inerte.
  #
  # Il depend de `ci` : on ne publie jamais une image dont la suite de tests
  # n'est pas passee.
  #
  # Pourquoi la publier plutot que la construire en session : l'egress d'une
  # session passe par un proxy qui re-termine TLS, et si le demon connait son
  # CA, chaque etape `RUN` d'un build s'execute dans un conteneur qui l'ignore
  # (`curl: (60) self-signed certificate in certificate chain`). Les *pulls*
  # passent. Voir la section « Docker dans une session » de CLAUDE.md.
  # ---------------------------------------------------------------------------
  dev-image:
    name: "Image de developpement"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ci]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_dev
          push: true
          # **Les deux tags comptent, et pas pour la meme raison.**
          # `compose.yaml` ecrit `image: ${IMAGES_PREFIX:-}app-php` **sans
          # tag** : Docker resout donc `:latest`, et c'est lui que la session
          # tire reellement. `:dev` ne sert qu'a dire ce que ce depot d'images
          # contient — ne publier que lui laisserait le `pull` chercher un
          # `:latest` qui n'existe pas.
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}-app-php:latest
            ghcr.io/${{ env.IMAGE_NAME }}-app-php:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push summary
        run: |
          echo "### Image de developpement poussee" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAME }}-app-php:latest\` (tiree par les sessions)" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # 4. Deploiement en production
  # ---------------------------------------------------------------------------
  # L'image est poussee : elle peut etre tiree par le serveur. On enchaine donc
  # ici, dans le meme run, plutot que d'esperer un evenement `release` que le
  # GITHUB_TOKEN n'emettra jamais.
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploiement"
    needs: [release, docker-push]
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      version: v${{ needs.release.outputs.new_release_version }}
