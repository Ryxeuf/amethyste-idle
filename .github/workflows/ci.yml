# =============================================================================
# CI Pipeline — Amethyste-Idle
# =============================================================================
# Declenchee sur chaque pull request vers `main`, et reutilisee par
# `release.yml` (workflow_call) lors d'un push sur `main`.
#
# Etapes : Titre de PR -> Lint (PHP-CS-Fixer) -> Analyse statique (PHPStan)
#          -> Tests (PHPUnit) -> Tests E2E (Panther)
#          -> Build Docker (validation de l'image de production)
# =============================================================================

name: CI

on:
  # Pas de declencheur `push` : un push sur `main` passe par `release.yml`,
  # qui appelle cette CI en workflow_call. Un declencheur `push` ferait tourner
  # la suite deux fois pour le meme commit.
  pull_request:
    branches: [main]
  workflow_call: # Permet a d'autres workflows de reutiliser cette CI (release.yml)

# Principe du moindre privilege : aucun job de la CI n'ecrit dans le depot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # On annule les executions obsoletes d'une PR, jamais celle d'une release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.4'
  POSTGRES_DB: amethyste
  POSTGRES_USER: app
  POSTGRES_PASSWORD: test_password
  # Une seule definition de l'environnement applicatif pour toute la CI : ces
  # valeurs etaient recopiees dans une dizaine de blocs `env:` de step, ou
  # elles finissaient par diverger.
  DATABASE_URL: "postgresql://app:test_password@127.0.0.1:5432/amethyste?serverVersion=17&charset=utf8"
  MERCURE_URL: "http://localhost/.well-known/mercure"
  MERCURE_PUBLIC_URL: "http://localhost/.well-known/mercure"
  MERCURE_JWT_SECRET: "ci_test_mercure_secret_0123456789abcdef0123456789abcdef"
  MESSENGER_TRANSPORT_DSN: "in-memory://"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Titre de la PR — commit conventionnel
  # ---------------------------------------------------------------------------
  # Les PR sont fusionnees en squash : le titre de la PR DEVIENT le message du
  # commit sur `main`, et c'est lui que Semantic Release analyse. Un titre hors
  # convention ne produit donc ni version, ni image, ni deploiement — la PR est
  # livree mais n'arrive jamais en production. Ce job rend la panne visible
  # avant le merge plutot qu'apres.
  # ---------------------------------------------------------------------------
  pr-title:
    name: "Titre de PR (commit conventionnel)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verifier le format du titre
        env:
          # Passe par l'environnement, jamais par interpolation directe dans le
          # script : un titre de PR est une donnee non fiable.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES='feat|fix|perf|refactor|ci|docs|style|test|chore|build|revert'
          if [[ "$PR_TITLE" =~ ^($TYPES)(\([a-zA-Z0-9_./ -]+\))?!?:[[:space:]].+ ]]; then
            echo "Titre conforme : $PR_TITLE"
            case "$PR_TITLE" in
              feat*|fix*|perf*|refactor*)
                echo "Ce type declenche une nouvelle version et un deploiement." ;;
              *)
                echo "Ce type ne declenche ni version ni deploiement (attendu)." ;;
            esac
            exit 0
          fi

          echo "::error title=Titre de PR non conventionnel::${PR_TITLE}"
          cat <<'MSG'

          Le merge est un squash : ce titre deviendra le message du commit sur
          main, et Semantic Release ne sait lire qu'un commit conventionnel.

            <type>(<portee optionnelle>): <description>

          Types acceptes : feat, fix, perf, refactor, ci, docs, style, test,
          chore, build, revert.

          Seuls feat, fix, perf et refactor produisent une version et un
          deploiement (cf. .releaserc.json et CLAUDE.md regle 14).

          Exemples :
            feat(zones): les Vallons d'Aubepine entrent dans le jeu
            fix: la DEF cesse de se perdre au desequipement
            docs: audit des donnees de jeu
          MSG
          exit 1

  # ---------------------------------------------------------------------------
  # 1. Verification du style de code (PHP-CS-Fixer)
  # ---------------------------------------------------------------------------
  lint:
    name: "Lint (PHP-CS-Fixer)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP + Composer
        uses: ./.github/actions/php-setup
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Run PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      # Doublonne volontairement TranslationCatalogAuditTest : les deux echouent
      # sur le meme defaut, mais ce job-ci rend son verdict sans base de donnees,
      # donc bien avant la suite PHPUnit. Le script liste les cles fautives.
      - name: Audit des traductions (parite FR/EN)
        run: php scripts/audit-translations.php --active-only

  # ---------------------------------------------------------------------------
  # 2. Analyse statique (PHPStan)
  # ---------------------------------------------------------------------------
  phpstan:
    name: "Analyse statique (PHPStan)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP + Composer
        uses: ./.github/actions/php-setup
        with:
          php-version: ${{ env.PHP_VERSION }}

      # Aucune base n'ecoute dans ce job : le warmup et l'analyse ne font que
      # construire le container, ils n'ouvrent jamais de connexion.
      - name: Warmup Symfony cache (dev)
        run: php bin/console cache:warmup --env=dev

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  # ---------------------------------------------------------------------------
  # 3. Tests unitaires et d'integration (PHPUnit)
  # ---------------------------------------------------------------------------
  tests:
    name: "Tests (PHPUnit)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: test
      PERF_MAX_RESPONSE_MS: "500"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U app -d amethyste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP + Composer
        uses: ./.github/actions/php-setup
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug

      - name: Create test database
        run: php bin/console doctrine:database:create --env=test --if-not-exists

      - name: Install vendor assets (importmap)
        run: php bin/console importmap:install --env=test

      - name: Setup test schema and fixtures
        run: |
          php bin/console doctrine:schema:create --env=test
          php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Validate game state coherence
        run: php bin/console app:game:validate --env=test

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --testdox --exclude-group e2e --testsuite Unit,Functional,Integration --coverage-clover coverage.xml --coverage-text

      # ---------------------------------------------------------------------
      # Le rapport de couverture fait ~1700 lignes et s'imprime **apres** la
      # liste des echecs : quand la suite tombe, la fin du journal ne montre
      # que de la couverture, et il faut derouler tout le fichier pour lire ce
      # qui a casse. Sur un journal tronque — une API, un terminal, une
      # notification —, l'information est simplement perdue.
      #
      # On rejoue donc la suite **sans couverture** quand elle echoue : sans
      # `--coverage-text`, la liste des echecs est la derniere chose imprimee.
      # L'etape ne coute rien quand tout passe, et rend le diagnostic immediat
      # quand rien ne va.
      # ---------------------------------------------------------------------
      # `--stop-on-*` : PHPUnit imprime encore, **apres** le detail des echecs,
      # la liste des tests « risques » et des depreciations — assez longue pour
      # repousser hors de vue ce qu'on est venu lire. S'arreter au premier
      # defaut met son detail en toute fin de journal, la ou on le cherche.
      - name: Rejouer les echecs sans couverture (diagnostic)
        if: failure()
        run: vendor/bin/phpunit --exclude-group e2e --testsuite Unit,Functional,Integration --no-progress --stop-on-failure --stop-on-error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Tests end-to-end (Panther + Chrome headless)
  # ---------------------------------------------------------------------------
  e2e:
    name: "Tests E2E (Panther)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [tests]

    env:
      APP_ENV: test
      PANTHER_NO_HEADLESS: 0
      PANTHER_CHROME_ARGUMENTS: "--disable-gpu --no-sandbox --disable-dev-shm-usage"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U app -d amethyste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP + Composer
        uses: ./.github/actions/php-setup
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        run: vendor/bin/bdi detect drivers

      # Panther demarre son propre serveur PHP : il ne herite pas des variables
      # du job, il lit les fichiers .env du projet.
      - name: Create .env.test.local for Panther server
        run: |
          {
            echo "DATABASE_URL=\"${DATABASE_URL}\""
            echo "MERCURE_URL=${MERCURE_URL}"
            echo "MERCURE_PUBLIC_URL=${MERCURE_PUBLIC_URL}"
            echo "MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET}"
            echo "MESSENGER_TRANSPORT_DSN=${MESSENGER_TRANSPORT_DSN}"
          } > .env.test.local

      - name: Install vendor assets (importmap)
        run: php bin/console importmap:install --env=test

      - name: Warmup Symfony cache, build assets
        run: |
          php bin/console tailwind:build --env=test
          php bin/console cache:warmup --env=test
          php bin/console assets:install public --env=test

      - name: Setup test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:schema:create --env=test
          php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Run E2E tests
        run: vendor/bin/phpunit --testsuite E2E --testdox

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: panther-screenshots
          path: var/error-screenshots/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 5. Build Docker — validation de l'image de production (pas de push)
  # ---------------------------------------------------------------------------
  docker-build:
    name: "Build Docker (validation)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, phpstan, tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_prod
          push: false
          load: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_ENV=prod

      - name: Smoke test — verify critical assets in image
        run: |
          docker run --rm ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ github.sha }} \
            test -f /app/assets/app.js \
            && echo "OK: app.js present" \
            || (echo "FAIL: app.js missing from image" && exit 1)

      # Le stage de prod fait `rm -Rf frankenphp/` : un entrypoint reste dans
      # les sources ne survit pas au build. `SchedulerWorkerDeploymentTest`
      # verifie la ligne `COPY` du Dockerfile ; seule l'image construite prouve
      # que le fichier est bien la, et executable. Sans lui, le service `worker`
      # meurt sur un « executable file not found » — apres deploiement, en
      # production, et le monde se refige en silence.
      - name: Smoke test — verify scheduler worker entrypoint
        run: |
          docker run --rm ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ github.sha }} \
            test -x /usr/local/bin/scheduler-entrypoint \
            && echo "OK: scheduler-entrypoint present and executable" \
            || (echo "FAIL: scheduler-entrypoint missing from image" && exit 1)

      # ---------------------------------------------------------------------
      # Le worker demarre-t-il vraiment ? (jalon F.0b)
      # ---------------------------------------------------------------------
      # Les deux tests ci-dessus verifient qu'un fichier existe, pas qu'un
      # processus vit. Le 2026-08-03, cinq releases consecutives ont ete perdues
      # sur « container amethyste-idle-worker-1 is unhealthy » : le worker
      # mourait au demarrage, et **aucun test du depot ne pouvait le voir**
      # puisque aucun n'avait jamais lance le conteneur. Sa premiere execution a
      # eu lieu en production.
      #
      # Ce smoke test lui donne une base et le laisse aller au bout de son
      # entrypoint : purge du cache, attente de la base, attente des migrations,
      # arriere de loyers, puis `messenger:consume`. Il attrape ce qu'aucune
      # assertion sur un fichier n'attrape — transport introuvable, commande
      # absente, erreur fatale au boot du noyau, cache empoisonne.
      - name: Smoke test — le worker consomme reellement le calendrier
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}"
          DB_URL="postgresql://app:test_password@smoke-db:5432/amethyste?serverVersion=17&charset=utf8"

          docker network create scheduler-smoke
          docker run -d --name smoke-db --network scheduler-smoke \
            -e POSTGRES_DB=amethyste \
            -e POSTGRES_USER=app \
            -e POSTGRES_PASSWORD=test_password \
            postgres:17-alpine

          echo "==> Attente de la base..."
          for _ in $(seq 1 30); do
            if docker exec smoke-db pg_isready -U app -d amethyste >/dev/null 2>&1; then break; fi
            sleep 2
          done

          # Le schema sans rejouer les migrations : le worker attend seulement
          # qu'elles soient *declarees* passees, et les rejouer ici testerait la
          # chaine de migrations, pas le worker.
          echo "==> Schema de test..."
          run_console() {
            docker run --rm --network scheduler-smoke -e DATABASE_URL="$DB_URL" \
              --entrypoint php "$IMAGE" /app/bin/console "$@"
          }
          run_console doctrine:schema:create --no-interaction
          run_console doctrine:migrations:sync-metadata-storage --no-interaction
          run_console doctrine:migrations:version --add --all --no-interaction

          echo "==> Demarrage du worker (entrypoint reel)..."
          docker run -d --name smoke-worker --network scheduler-smoke \
            -e DATABASE_URL="$DB_URL" \
            --entrypoint scheduler-entrypoint "$IMAGE"

          # Exactement la sonde de sante de `compose.yaml` : ce que la CI declare
          # sain doit etre ce que la production declare sain.
          ok=0
          for _ in $(seq 1 60); do
            if docker exec smoke-worker sh -c "tr '\0' '\n' < /proc/1/cmdline | grep -q messenger:consume" 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done

          echo "===================== logs du worker ====================="
          docker logs smoke-worker 2>&1 | tail -n 120
          echo "=========================================================="

          if [ "$ok" -ne 1 ]; then
            echo "FAIL: le worker n'a pas atteint « messenger:consume » en 120 s."
            echo "      C'est exactement l'echec qui casse le deploiement de production."
            exit 1
          fi
          echo "OK: le worker consomme le transport scheduler_default."

      - name: Nettoyage du smoke test worker
        if: always()
        run: |
          docker rm -f smoke-worker smoke-db >/dev/null 2>&1 || true
          docker network rm scheduler-smoke >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------------
  # 6. Verdict unique — cible ideale pour une regle de protection de branche
  # ---------------------------------------------------------------------------
  # Un seul check requis a declarer sur `main`, qui reste valide meme si la
  # liste des jobs ci-dessus change.
  # ---------------------------------------------------------------------------
  ci-success:
    name: "CI"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [pr-title, lint, phpstan, tests, e2e, docker-build]

    steps:
      - name: Verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultats des jobs : $RESULTS"
          for result in $RESULTS; do
            # `skipped` est legitime : `pr-title` ne tourne pas hors pull request.
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Au moins un job de la CI a echoue ($result)."
              exit 1
            fi
          done
          echo "Tous les jobs de la CI sont passes."
