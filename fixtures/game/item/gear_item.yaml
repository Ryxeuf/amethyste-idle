  # === Armures Tissu — la ligne du tailleur (ECO-31) ===
  # Le trou beant de l'audit d'economie : sur 121 pieces d'equipement, **pas une
  # robe**. Les domaines de sort — pyromancien, hydromancien, necromancien —
  # s'habillaient en cuir et en metal, et aucun metier ne les habillait.
  #
  # Le pendant exact de la serie cuir : memes emplacements, memes paliers, meme
  # progression de rarete. Ce qui change est l'axe — la ou le cuir donne de la
  # protection, le tissu donne de la puissance magique, et il en paie le prix en
  # protection. Un mage en robe encaisse moins et frappe plus fort.

  # --- Palier 1 : toile de lin (common, niveau 1) ---
  # Le plancher T1 du lanceur de sorts (ECO-02) : trois pieces atteignables des
  # le premier jour, a partir du lin des Vallons et de rien d'autre.
