  # =====================================================================
  # OBJ-02b — les minerais d'extension quittent la base.
  #
  # L'adamantite et l'astretal (Extension 1) et le voidium (Extension 2)
  # vivaient ici sans un seul filon : GAME_ZONES §3 les reserve aux
  # extensions, et une matiere livree sans source est un mensonge
  # d'interface. Leur definition est versee a docs/EXTENSION_RESERVE.md.
  # L'orichalque reste : son filon existe (Cite ensevelie), c'est l'intrant
  # de base que les alliages d'extension viendront consommer (GAME_WORLD
  # §5.5). L'amethystite y figure encore par son rang de fichier, plus par
  # son palier : elle n'en a plus (voir juste dessous).
  # =====================================================================
  # ZON-40 — l'amethystite quitte le palier legendaire.
  #
  # Elle y avait ete posee par l'ancien lore, ou le Cristal d'Amethyste etait
  # l'artefact final. Le socle de monde dit l'inverse (GAME_WORLD § 1 et § 13.3) :
  # « sediment durci, minerai, **inerte, commercable** », et surtout **aucun
  # gisement** — l'amethyste est un sous-produit universel, presente partout, et
  # seule sa **bande de purete** varie selon le lieu.
  #
  # Une matiere qu'on trouve dans trois zones de depart ne peut pas valoir 800
  # gils ni etre « reservee aux maitres mineurs ». Le prix descend a 15 — entre
  # le fer et l'argent : ce qu'elle vaut brute est modeste, et c'est la purete
  # (ECO-23) qui fait le reste de sa valeur au comptoir.
  #
  # BALANCE § 21.5 avait laisse l'arbitrage ouvert en toutes lettres — « source
  # unique et rare, ou presente partout, la purete seule variant selon le
  # lieu ». C'est la seconde branche qui est prise.
  ore_amethyst_crystal (extends item):
    id: 24
    name: 'Améthystite'
    description: 'Un cristal violet aux reflets magiques, signature du monde d''Améthyste. Elle affleure un peu partout — c''est sa pureté, jamais sa rareté, qui fait son prix.'
    type: 'resource'
    slug: 'ore-amethyst-crystal'
    price: 15
    rarity: 'common'
    domain: '@miner'
